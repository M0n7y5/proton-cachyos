# 32-bit build on an x86_64 host, which is how Proton builds the i386 half of a
# layer: same sources, same manifest, a per-arch library directory.  Requires a
# multilib toolchain and the 32-bit Vulkan loader; nothing here is specific to
# this machine beyond those paths.
[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/lib32/pkgconfig']

[built-in options]
c_args = ['-m32']
c_link_args = ['-m32']
cpp_args = ['-m32']
cpp_link_args = ['-m32']

[host_machine]
system = 'linux'
kernel = 'linux'
subsystem = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
