# Draft workflow for a personal Proton-CachyOS-PipeWire fork.
# Drop into: .github/workflows/pipewire-proton-ci.yml
#
# Based on NelloKudo/proton-cachyos + CachyOS/proton-cachyos
# (_job_build.yml / snapshot.yml / release.yml), slimmed to one x86_64
# redist cell (baseline or x86-64-v3, see the `variant` input) for free
# GitHub-hosted runners.
#
# Purpose: build Proton against a chosen wine-cachyos SHA (driver CI for
# _upstream_pipewire work), not only the submodule pin in the proton tree.
#
# Prerequisites on the fork:
#   - dispatch override SHAs exist in CachyOS/wine-cachyos or
#     M0n7y5/wine-cachyos (the resolver checks both immutable sources)
#   - dispatch override SHAs CONTAIN the tree's wine submodule pin: the proton
#     tree pins ffmpeg/gstreamer/vkd3d in lockstep with wine, and the official
#     pipeline only ever builds that pin (see the gate in "Resolve wine SHA")
#   - Makefile.in already has --with-pipewire + steamrtdeps/build-pipewire.mk
#     (true on CachyOS/Nello proton 11.0 trees - do not re-add blindly)
#   - Remove obsolete patches/wine/*PROTON_PW_RT* if the tree no longer
#     enables PW_STREAM_FLAG_RT_PROCESS by default
#
# [FACT] pattern validated by Nello run 29689279331 and CachyOS proton CI.
# [EST]  single build cell: ~2.5-3.5h cold, ~25-45m warm with ccache.

name: Proton-CachyOS-PipeWire

on:
  workflow_dispatch:
    inputs:
      wine_sha:
        description: >-
          Full 40-char immutable wine-cachyos commit SHA to build.
          Must contain the proton tree's wine submodule pin (rebase your branch
          onto it first) - older/divergent wine breaks against the tree's
          vendored ffmpeg. Empty = use the proton repo's wine submodule pin.
          (Future: repository_dispatch from wine-side CI can supply the same SHA.)
        type: string
        required: false
        default: ''
      variant:
        description: >-
          Micro-architecture of the single build cell, taken verbatim from the
          official snapshot.yml matrix. x86_64 is the baseline cell
          (-march=nocona); x86_64_v3 is the x86-64-v3 cell. Both official cells
          share the same rustflags and carry no extra configure argument, so
          this only switches CFLAGS and the -<variant> suffix on the build name.
        type: choice
        required: false
        default: x86_64_v3
        options:
          - x86_64
          - x86_64_v3
      publish_release:
        description: 'Create/update a GitHub prerelease and upload the tarball'
        type: boolean
        default: false
      release_tag:
        description: 'Tag name when publish_release=true (e.g. pipewire-11.0-20260720-slr)'
        type: string
        default: ''
      runner:
        description: >-
          Build job runner label. Default: Ubicloud 30 vCPU x64
          (ubicloud-standard-30; premium fleet is account-default since mid-2026).
          ubicloud-standard-16 is mid-tier; ubuntu-24.04 is free GitHub-hosted fallback.
        type: choice
        required: false
        default: ubicloud-standard-30
        options:
          - ubicloud-standard-30
          - ubicloud-standard-16
          - ubuntu-24.04
  # Tag pushes always use the submodule pin (no wine_sha input on push events)
  # and build x86_64_v3: push events carry no inputs at all, so PROTON_VARIANT
  # below falls back to the same value a plain dispatch defaults to. Dispatch
  # variant=x86_64 explicitly when a baseline build is wanted.
  push:
    tags:
      - 'pipewire-*-*-slr'
      - 'pw-cachyos-*-*-slr'
  # Future: wine-side CI can POST repository_dispatch with client_payload.wine_sha.
  # repository_dispatch:
  #   types: [build-proton-with-wine]

concurrency:
  group: pw-proton-${{ github.ref_name }}-${{ inputs.wine_sha || 'pin' }}-${{ inputs.variant || 'x86_64_v3' }}-${{ inputs.runner || 'default' }}
  cancel-in-progress: true

# Least privilege default: jobs only get a read-capable GITHUB_TOKEN.
# contents: write is granted solely on the release job (tag + gh release).
permissions:
  contents: read
  actions: read

env:
  # Keep build name Steam-friendly (directory under compatibilitytools.d).
  BUILD_PREFIX: Proton-CachyOS-PipeWire
  # Micro-architecture variant of our single build cell, mirroring the official
  # snapshot.yml x86_64 / x86_64_v3 rows. Exported into every step, so the
  # version job and the ccache guard read one value instead of re-deriving it.
  PROTON_VARIANT: ${{ inputs.variant || 'x86_64_v3' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      full_desc: ${{ steps.version.outputs.full_desc }}
      build_name: ${{ steps.version.outputs.build_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      do_release: ${{ steps.version.outputs.do_release }}
      wine_sha_input: ${{ steps.version.outputs.wine_sha_input }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: version
        shell: bash
        env:
          WINE_SHA_IN: ${{ inputs.wine_sha || '' }}
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            full_desc=$(git describe --long --tags)
          else
            full_desc="0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "full_desc=$full_desc" >> "$GITHUB_OUTPUT"

          wine_sha_input="${WINE_SHA_IN//[[:space:]]/}"
          if [[ -n "$wine_sha_input" ]]; then
            if [[ ! "$wine_sha_input" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::wine_sha must be a full 40-char hex commit SHA (got: ${wine_sha_input})"
              exit 1
            fi
            wine_sha_input=$(echo "$wine_sha_input" | tr 'A-F' 'a-f')
          fi
          echo "wine_sha_input=$wine_sha_input" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            build_name="${BUILD_PREFIX}-${tag}-${PROTON_VARIANT}"
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            tag="${{ inputs.release_tag }}"
            if [[ -n "$wine_sha_input" ]]; then
              build_name="${BUILD_PREFIX}-${full_desc}-wine${wine_sha_input:0:8}-${PROTON_VARIANT}"
            else
              build_name="${BUILD_PREFIX}-${full_desc}-${PROTON_VARIANT}"
            fi
            if [[ "${{ inputs.publish_release }}" == "true" && -n "$tag" ]]; then
              echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
              echo "do_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release_tag=" >> "$GITHUB_OUTPUT"
              echo "do_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name"
          echo "wine_sha_input=${wine_sha_input:-<submodule pin>}"
          echo "variant=${PROTON_VARIANT}"

  build:
    name: Build ${{ inputs.variant || 'x86_64_v3' }}
    needs: version
    # workflow_dispatch supplies inputs.runner; tag-push has no inputs → free GHA.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    outputs:
      wine_sha: ${{ steps.wine-pin.outputs.wine_sha }}
      wine_source: ${{ steps.wine-pin.outputs.wine_source }}
      proton_sha: ${{ steps.wine-pin.outputs.proton_sha }}
    # Single source of truth for the build identity the ccache key hashes.
    # Mirrors _job_build.yml, where inputs.cflags/inputs.configure feed both the
    # Configure step and the cache checksum, so the two cannot drift apart.
    env:
      PROTON_TARGET_ARCH: x86_64
      # Match the CachyOS/Nello snapshot cell for this variant. Job-level env
      # cannot read the env context, so the fallback is spelled out again here
      # rather than reusing PROTON_VARIANT. Only -march differs between the two
      # official rows: rustflags are byte-identical (upstream keeps
      # -Ctarget-cpu=nocona on the v3 cell too) and neither row adds a
      # configure argument, so PROTON_CONFIGURE stays variant-independent.
      PROTON_CFLAGS: ${{ (inputs.variant || 'x86_64_v3') == 'x86_64_v3' && '-O3 -march=x86-64-v3 -mtune=core-avx2' || '-O3 -march=nocona -mtune=core-avx2' }}
      PROTON_RUSTFLAGS: -Copt-level=3 -Ctarget-cpu=nocona
      PROTON_CONFIGURE: --enable-ccache
    steps:
      - name: Debloat GitHub runner
        # Free GHA ~14GB usable; Ubicloud 300-400GB - skip GitHub-image debloat there.
        if: ${{ !startsWith(inputs.runner || 'ubuntu-24.04', 'ubicloud') }}
        # Third-party: pin full commit SHA (tag v3 → v3.2.2 peel).
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >-
            azure-cli
            google-cloud-cli
            microsoft-edge-stable
            google-chrome-stable
            firefox
            postgresql*
            temurin-*
            *llvm*
            mysql*
            dotnet-sdk-*
          remove_packages_one_command: false
          remove_folders: >-
            /usr/share/swift
            /usr/share/miniconda
            /usr/share/az*
            /usr/local/lib/node_modules
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/local/julia
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /usr/share/gradle
          testing: false

      - name: Prepare host
        run: sudo apt-get update && sudo apt-get install -y ccache fontforge-nox

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      # tree:0 keeps submodule blob download smaller (CachyOS/Nello pattern).
      # Never use `git submodule update --remote` - non-reproducible moving tip.
      - name: Submodules
        run: |
          set -euo pipefail
          git submodule update --init --filter=tree:0 --recursive
          mkdir -p build

      - name: Resolve wine SHA
        id: wine-pin
        env:
          WINE_SHA_INPUT: ${{ needs.version.outputs.wine_sha_input }}
        run: |
          set -euo pipefail
          proton_sha=$(git rev-parse HEAD)
          echo "proton_sha=$proton_sha" >> "$GITHUB_OUTPUT"

          wine_url=$(git config -f .gitmodules --get submodule.wine.url)
          wine_fallback_url=https://github.com/M0n7y5/wine-cachyos.git
          wine_path=$(git config -f .gitmodules --get submodule.wine.path)
          test -n "$wine_url"
          test -n "$wine_path"
          test -d "$wine_path"

          pin_sha=$(git -C "$wine_path" rev-parse HEAD)
          echo "submodule_pin_sha=$pin_sha" >> "$GITHUB_OUTPUT"
          echo "wine_url=$wine_url" >> "$GITHUB_OUTPUT"

          override="${WINE_SHA_INPUT//[[:space:]]/}"
          if [[ -n "$override" ]]; then
            if [[ ! "$override" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::wine_sha must be full 40-char lowercase hex (got: ${override})"
              exit 1
            fi
            # No --depth=1: the lockstep gate below needs a real commit graph,
            # and a shallow graft makes `merge-base --is-ancestor` answer "no".
            # The submodule clone is blobless (--filter=tree:0), so a full-history
            # fetch only adds commit metadata the pin does not already carry.
            echo "Fetching immutable wine ${override} from configured submodule URL: ${wine_url}"
            if git -C "$wine_path" fetch --no-tags "$wine_url" "$override"; then
              fetched_url="$wine_url"
            else
              echo "::warning::SHA not served by configured submodule URL; trying ${wine_fallback_url}"
              if ! git -C "$wine_path" fetch --no-tags "$wine_fallback_url" "$override"; then
                echo "::error::wine ${override} is unavailable from both ${wine_url} and ${wine_fallback_url}"
                exit 1
              fi
              fetched_url="$wine_fallback_url"
            fi
            echo "Fetched wine ${override} from ${fetched_url}"
            got=$(git -C "$wine_path" rev-parse FETCH_HEAD)
            if [[ "$got" != "$override" ]]; then
              echo "::error::fetched wine object ${got} != requested ${override}"
              exit 1
            fi

            # Lockstep gate. The proton tree pins its vendored dependencies
            # (ffmpeg, gstreamer, vkd3d, ...) in step with the wine submodule,
            # and the official pipeline only ever builds that pin - so a wine
            # tree that does not contain the pin is an unsupported pairing.
            # Run 30159382825 dispatched wine 6cab070d (topic branch off the
            # older cachyos_11.0_release line, still carrying mediaconv-era
            # dlls/winedmo/libavcodec/pcm_byte_order_reverse_bsf.c written for
            # the pre-6.x FFmpeg API) against this tree's FFmpeg master pin
            # f46e5144, and died ~21 min into `make redist`. Reject in seconds.
            if ! git -C "$wine_path" merge-base --is-ancestor "$pin_sha" "$override"; then
              echo "::error::wine ${override} does not contain the proton tree's wine submodule pin ${pin_sha}"
              if git -C "$wine_path" merge-base --is-ancestor "$override" "$pin_sha"; then
                echo "::error::the pin already contains ${override} - dispatch with an empty wine_sha to build it"
              else
                echo "::error::rebase the wine branch onto ${pin_sha} before dispatching it"
              fi
              exit 1
            fi
            echo "OK: ${override} contains wine submodule pin ${pin_sha}"
            git -C "$wine_path" checkout --detach --force "$override"
            wine_sha=$(git -C "$wine_path" rev-parse HEAD)
            if [[ "$wine_sha" != "$override" ]]; then
              echo "::error::checkout left wine at ${wine_sha}, expected ${override}"
              exit 1
            fi
            wine_source="dispatch-override"
          else
            wine_sha="$pin_sha"
            wine_source="submodule-pin"
          fi

          echo "wine_sha=$wine_sha" >> "$GITHUB_OUTPUT"
          echo "wine_source=$wine_source" >> "$GITHUB_OUTPUT"

          {
            echo "### Wine pin"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| proton_sha | \`${proton_sha}\` |"
            echo "| wine_url | \`${wine_url}\` |"
            echo "| wine_sha | \`${wine_sha}\` |"
            echo "| wine_source | \`${wine_source}\` |"
            echo "| submodule_pin | \`${pin_sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Effective wine_sha=${wine_sha} (${wine_source})"

      # Fail hard before the multi-hour redist if the product claim cannot hold:
      # umu cmd.exe smoke later will pass even when winepipewire was never built.
      - name: Pre-build assert driver source + configure
        env:
          WINE_SHA: ${{ steps.wine-pin.outputs.wine_sha }}
        run: |
          set -euo pipefail
          wine_path=$(git config -f .gitmodules --get submodule.wine.path)
          test -d "$wine_path"
          wine_sha="${WINE_SHA}"
          test -n "$wine_sha"

          # 1) Effective wine tree must contain winepipewire.drv at this SHA.
          if ! git -C "$wine_path" cat-file -e "${wine_sha}:dlls/winepipewire.drv/pipewire.c"; then
            echo "::error::wine ${wine_sha} has no dlls/winepipewire.drv/pipewire.c - refusing to build a tree without the PipeWire driver source"
            exit 1
          fi
          echo "OK: ${wine_sha}:dlls/winepipewire.drv/pipewire.c present"

          # 2) Proton Makefile must actually pass --with-pipewire (WINE_AUTOCONF_ARGS).
          if [[ ! -f Makefile.in ]]; then
            echo "::error::Makefile.in missing at proton tree root"
            exit 1
          fi
          if ! grep -nE '^WINE_AUTOCONF_ARGS' -A120 Makefile.in | grep -qE -- '--with-pipewire'; then
            echo "::error::Makefile.in WINE_AUTOCONF_ARGS is missing --with-pipewire - config would omit winepipewire.drv"
            grep -nE 'WINE_AUTOCONF|pipewire' Makefile.in || true
            exit 1
          fi
          echo "OK: Makefile.in WINE_AUTOCONF_ARGS includes --with-pipewire"
          {
            echo ""
            echo "### Pre-build driver gates"
            echo "- wine blob: \`${wine_sha}:dlls/winepipewire.drv/pipewire.c\`"
            echo "- Makefile.in: \`--with-pipewire\` in WINE_AUTOCONF_ARGS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure
        working-directory: build
        env:
          CFLAGS: ${{ env.PROTON_CFLAGS }}
          RUSTFLAGS: ${{ env.PROTON_RUSTFLAGS }}
          USE_LTO: 0
        run: |
          set -euo pipefail
          # PROTON_CONFIGURE is a deliberate argument list - leave it unquoted.
          ../configure.sh \
            --build-name=${{ needs.version.outputs.build_name }} \
            --container-engine=docker \
            ${PROTON_CONFIGURE}
          # Official _job_build.yml parity: dump the generated Makefile so the
          # SDK image and vendored-dep (ffmpeg/gstreamer/vkd3d) targets are in
          # the log next to the configure output.
          cat Makefile

      - name: Cache identifier
        working-directory: build
        id: ccache-id
        run: |
          set -euo pipefail
          # _job_build.yml formula: sha1 of the SteamRT SDK image string plus the
          # configure-relevant build identity. The image string only exists after
          # configure, so read it back from the generated Makefile rather than
          # hardcoding a tag. RUSTFLAGS is excluded on purpose: ccache covers the
          # C/C++ objects only, and official hashes cflags + configure likewise.
          # The variant reaches the hash through PROTON_CFLAGS (-march is the
          # only thing the official x86_64 / x86_64_v3 rows disagree on), which
          # is what keeps the two variants on separate cache entries. Assert it,
          # because a variant whose -march never made it into CFLAGS would
          # silently restore and then overwrite the other variant's objects.
          case "$PROTON_VARIANT" in
            x86_64)    want_march=-march=nocona ;;
            x86_64_v3) want_march=-march=x86-64-v3 ;;
            *)
              echo "::error::unknown PROTON_VARIANT '${PROTON_VARIANT}'"
              exit 1
              ;;
          esac
          if [[ "$PROTON_CFLAGS" != *"$want_march"* ]]; then
            echo "::error::variant ${PROTON_VARIANT} expects ${want_march}, but PROTON_CFLAGS is '${PROTON_CFLAGS}' - the ccache key would not separate variants"
            exit 1
          fi
          echo "variant=${PROTON_VARIANT} (${want_march}) cflags='${PROTON_CFLAGS}'"
          image=$(make get-steamrt-image | tail -1)
          test -n "$image"
          base_hash=$(echo "$image $PROTON_TARGET_ARCH $PROTON_CFLAGS $PROTON_CONFIGURE" | sha1sum | cut -d' ' -f1)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "base_hash=$base_hash" >> "$GITHUB_OUTPUT"
          echo "image=$image"
          echo "base_hash=$base_hash"
          # actions/cache saves ~/.ccache, and Makefile.in only falls back to
          # $(HOME)/.ccache when CCACHE_DIR is unset (it also forwards every
          # CCACHE_* host var into the container). If anything in the runner
          # environment moves that path, the container fills a directory the
          # cache step never sees and every run silently starts cold.
          ccache_dir="${CCACHE_DIR:-${HOME}/.ccache}"
          if [[ "$ccache_dir" != "${HOME}/.ccache" ]]; then
            echo "::error::CCACHE_DIR=${ccache_dir} does not match the cached path ${HOME}/.ccache"
            exit 1
          fi
          echo "ccache_dir=${ccache_dir}"

      # Ubicloud runners serve actions/cache through their own transparent cache
      # proxy, so entries never show up in GitHub's /actions/caches API or in the
      # repo cache usage totals. Run 30162478567 saved 568 MB under key
      # ccache-pw-proton-19f5ccea...-1ba4fa16...-30162478567 while that API
      # reported zero entries. Caches are per backend: an ubicloud run and an
      # ubuntu-24.04 run never share one.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache
          key: ccache-pw-proton-${{ steps.ccache-id.outputs.base_hash }}-${{ steps.wine-pin.outputs.wine_sha }}-${{ github.run_id }}
          # Toolchain-scoped only: same wine tree first, then any wine tree built
          # with the same SDK image + arch + cflags/configure. Nothing broader -
          # a universal prefix can restore objects from a different SDK image.
          restore-keys: |
            ccache-pw-proton-${{ steps.ccache-id.outputs.base_hash }}-${{ steps.wine-pin.outputs.wine_sha }}-
            ccache-pw-proton-${{ steps.ccache-id.outputs.base_hash }}-

      - name: Make redist
        working-directory: build
        run: make redist

      - name: Report ccache
        if: always()
        env:
          STEAMRT_IMAGE: ${{ steps.ccache-id.outputs.image }}
        run: |
          set -euo pipefail
          dir="${HOME}/.ccache"
          if [[ ! -d "$dir" ]]; then
            echo "::warning::${dir} does not exist, so the save step has nothing to upload"
            exit 0
          fi
          size=$(du -sh "$dir" | cut -f1)
          files=$(find "$dir" -type f | wc -l)
          echo "ccache dir ${dir}: ${size}, ${files} files"
          if [[ "$files" -eq 0 ]]; then
            echo "::warning::ccache directory is empty; check ENABLE_CCACHE and the container bind mount"
          fi
          # The SDK image ships its own ccache and the host binary may be older,
          # so stats are best effort and never fail the job.
          CCACHE_DIR="$dir" ccache --show-stats 2>&1 | head -30 || true
          {
            echo ""
            echo "### ccache"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| dir | \`${dir}\` |"
            echo "| size | ${size} |"
            echo "| files | ${files} |"
            echo "| sdk image | \`${STEAMRT_IMAGE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert winepipewire.so in redist + write build-info
        id: build-info
        env:
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          WINE_SHA: ${{ steps.wine-pin.outputs.wine_sha }}
          WINE_SOURCE: ${{ steps.wine-pin.outputs.wine_source }}
          PROTON_SHA: ${{ steps.wine-pin.outputs.proton_sha }}
          STEAMRT_IMAGE: ${{ steps.ccache-id.outputs.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          info_path="${BUILD_NAME}.build-info.txt"
          tar_path="build/${BUILD_NAME}.tar.xz"
          test -f "$tar_path"

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xJf "$tar_path" -C "$work"
          # tarball root is usually BUILD_NAME/ ; fall back to single top dir.
          if [[ -d "$work/${BUILD_NAME}" ]]; then
            root="$work/${BUILD_NAME}"
          else
            root=$(find "$work" -mindepth 1 -maxdepth 1 -type d | head -1)
          fi
          test -n "$root"

          # --- POST-BUILD: product claim = both unix winepipewire.so shipped ---
          so64="${root}/files/lib/wine/x86_64-unix/winepipewire.so"
          so32="${root}/files/lib/wine/i386-unix/winepipewire.so"
          for so in "$so64" "$so32"; do
            if [[ ! -f "$so" ]]; then
              echo "::error::missing ${so#${root}/} in redist - PipeWire driver was omitted from the build"
              echo "Looking under ${root}/files/lib/wine:"
              find "${root}/files/lib/wine" -iname '*pipewire*' 2>/dev/null || true
              exit 1
            fi
            if [[ ! -s "$so" ]]; then
              echo "::error::${so#${root}/} exists but is empty"
              exit 1
            fi
            ft=$(file -b "$so" || true)
            if [[ "$ft" != *ELF* ]]; then
              echo "::error::${so#${root}/} is not an ELF shared object (file: ${ft})"
              exit 1
            fi
            if command -v readelf >/dev/null 2>&1; then
              if ! readelf -h "$so" >/dev/null; then
                echo "::error::readelf failed on ${so#${root}/}"
                exit 1
              fi
            fi
            echo "OK: ${so#${root}/} ($(wc -c < "$so") bytes, ${ft})"
          done

          # Optional-but-included revision fingerprint (update when driver log strings change).
          # Matches WARN text from core-reconnect invalidate path in pipewire.c
          # ("invalidating %u live stream(s)..."). Bump the pattern when that message is reworded.
          if ! strings "$so64" | grep -qE 'invalidating .* live stream'; then
            echo "::error::x86_64 winepipewire.so lacks expected driver fingerprint string"
            echo "::error::update the fingerprint grep if the driver log message changed deliberately"
            exit 1
          fi
          echo "OK: driver fingerprint 'invalidating .* live stream' present in x86_64 .so"

          sha64=$(sha256sum "$so64" | awk '{print $1}')
          sha32=$(sha256sum "$so32" | awk '{print $1}')
          echo "winepipewire_x86_64_sha256=${sha64}"
          echo "winepipewire_i386_sha256=${sha32}"

          {
            echo "build_name=${BUILD_NAME}"
            echo "proton_repo=${{ github.repository }}"
            echo "proton_sha=${PROTON_SHA}"
            echo "proton_ref=${{ github.ref }}"
            echo "wine_sha=${WINE_SHA}"
            echo "wine_source=${WINE_SOURCE}"
            echo "wine_url=$(git config -f .gitmodules --get submodule.wine.url)"
            echo "steamrt_image=${STEAMRT_IMAGE}"
            echo "workflow_run=${RUN_URL}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "winepipewire_x86_64_unix_sha256=${sha64}"
            echo "winepipewire_i386_unix_sha256=${sha32}"
          } | tee "$info_path"

          # Pack metadata into the redist tree and refresh the tarball + checksum
          # so testers get wine_sha even if they only download the .tar.xz.
          cp -f "$info_path" "$root/build-info.txt"
          tar -C "$work" -cJf "$tar_path" "$(basename "$root")"
          (cd build && sha512sum "${BUILD_NAME}.tar.xz" > "${BUILD_NAME}.sha512sum")
          cp -f "$info_path" "build/${BUILD_NAME}.build-info.txt"

          {
            echo ""
            echo "### build-info.txt"
            echo '```'
            cat "$info_path"
            echo '```'
            echo ""
            echo "### Post-build winepipewire.so"
            echo "| Arch | sha256 |"
            echo "|---|---|"
            echo "| x86_64-unix | \`${sha64}\` |"
            echo "| i386-unix | \`${sha32}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.tar.xz
          path: build/${{ needs.version.outputs.build_name }}.tar.xz
          if-no-files-found: error

      - name: Upload artifact checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.sha512sum
          path: build/${{ needs.version.outputs.build_name }}.sha512sum
          if-no-files-found: error

      - name: Upload build-info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.build-info.txt
          path: build/${{ needs.version.outputs.build_name }}.build-info.txt
          if-no-files-found: error

  # Smoke gate, two layers:
  #
  #   1. Wine smoke (required, dependency-free). Unpacks the redist and drives
  #      files/bin/wine straight from the tree: no Steam runtime, no container,
  #      no network. That keeps driver CI independent of third-party CDNs.
  #
  #   2. umu-launcher end to end (best effort, continue-on-error). umu fetches
  #      the steamrt4 platform from repo.steampowered.com. Run 30162478567
  #      logged "ERROR: repo.steampowered.com returned the status: 403" and
  #      then FileNotFoundError on toolmanifest.vdf. That was not IP filtering:
  #      Valve stopped serving the directory-style version path, and our pinned
  #      umu still asked for it. umu 1.4.2.rc0 requested
  #      /steamrt4/images/latest-public-beta/VERSION.txt, which now answers 403
  #      ("Google-Edge-Cache ... Error: 118") from any client; upstream commit
  #      fb9912e239fd6c55f3d51b8392077c090807e9f1 (2026-07-24) switched to
  #      /steamrt4/images/latest-public-beta.txt, which answers 200. The pin
  #      below now carries that fix, and run 30166266466 got as far as a
  #      downloaded, mtree-verified steamrt4 before dying one step later in
  #      pressure-vessel-wrap: "bwrap: setting up uid map: Permission denied".
  #      ubuntu-24.04 blocks unprivileged user namespaces unless a bwrap
  #      AppArmor profile is loaded, so the step now runs the same host prep
  #      as the official _job_test.yml "Update host" step. With the pin fix
  #      and that profile the step is expected to go green. It stays
  #      non-gating regardless, because it rides on third-party infra
  #      (repo.steampowered.com and the umu repo) that must never decide
  #      whether our driver build is good; official wires its test job with
  #      continue: true for the same reason.
  #
  # Neither layer loads winepipewire.drv against a live daemon, so the product
  # audio path stays unverified here; presence is what we gate on.
  #
  # TODO (ideal future step, not implemented): mmdevapi render smoke against a
  # private PipeWire daemon inside the runner, e.g.:
  #   - apt install pipewire wireplumber pipewire-pulse / or build minimal pw
  #   - XDG_RUNTIME_DIR=... pipewire & wireplumber &  (null sink / dummy driver)
  #   - WINEDEBUG=+pipewire PROTON_LOG=1 run a tiny mmdevapi render EXE
  #     (or wine's mmdevapi test) and grep the log for winepipewire init +
  #     stream connect; fail if pulse/alsa backend was selected instead.
  # Headless PW+session is flaky on GHA; keep this as a follow-up, not a gate.
  smoke:
    name: Smoke wine
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      WINE_SHA: ${{ needs.build.outputs.wine_sha }}
    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.version.outputs.build_name }}.tar.xz

      - name: Extract redist
        id: extract
        run: |
          set -euo pipefail
          tar -xJf "${BUILD_NAME}.tar.xz"
          # Prefer tree root matching build_name; else first top-level dir.
          if [[ -d "$BUILD_NAME" ]]; then
            root="$BUILD_NAME"
          else
            root=$(find . -mindepth 1 -maxdepth 1 -type d | head -1)
          fi
          test -n "$root"
          # Provenance: the artifact must carry the wine sha the build job resolved.
          test -f "${root}/build-info.txt"
          grep -q "wine_sha=${WINE_SHA}" "${root}/build-info.txt"
          echo "root=${PWD}/${root}" >> "$GITHUB_OUTPUT"
          {
            echo "### build-info.txt (from artifact)"
            echo '```'
            cat "${root}/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wine smoke
        env:
          PROTON_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail

          # End-of-chain driver proof: cheap and redundant with the build job's
          # assert, but it checks the artifact testers actually download.
          for so in x86_64-unix i386-unix; do
            path="${PROTON_ROOT}/files/lib/wine/${so}/winepipewire.so"
            if [[ ! -s "$path" ]]; then
              echo "::error::redist artifact has no ${so}/winepipewire.so"
              find "${PROTON_ROOT}/files/lib/wine" -iname '*pipewire*' || true
              exit 1
            fi
            echo "OK: files/lib/wine/${so}/winepipewire.so ($(wc -c < "$path") bytes)"
          done

          wine="${PROTON_ROOT}/files/bin/wine"
          test -x "$wine"
          missing=$(ldd "$wine" | grep 'not found' || true)
          if [[ -n "$missing" ]]; then
            echo "::error::files/bin/wine has unresolved libraries on a bare runner:"
            echo "$missing"
            exit 1
          fi

          # Bare-metal wine, no pressure-vessel: WINEPREFIX plus dll overrides
          # is all the redist layout needs. mscoree/mshtml are disabled so
          # wineboot never reaches for mono/gecko over the network.
          export WINEPREFIX="${RUNNER_TEMP}/pipewire-smoke-pfx"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEDEBUG=-all
          rm -rf "$WINEPREFIX"

          version=$("$wine" --version)
          echo "wine --version: ${version}"
          test -n "$version"

          timeout 600 "$wine" wineboot -i
          timeout 120 "${PROTON_ROOT}/files/bin/wineserver" -w || true

          for want in system.reg user.reg drive_c/windows/system32; do
            if [[ ! -e "${WINEPREFIX}/${want}" ]]; then
              echo "::error::wineboot -i left no ${want} in the scratch prefix"
              ls -la "$WINEPREFIX" || true
              exit 1
            fi
          done
          echo "OK: scratch prefix booted ($(wc -c < "${WINEPREFIX}/system.reg") byte system.reg)"

          {
            echo ""
            echo "### Wine smoke (dependency-free)"
            echo "- \`files/bin/wine --version\` -> \`${version}\`"
            echo "- \`wineboot -i\` created \`system.reg\`, \`user.reg\`, \`drive_c/windows/system32\`"
            echo "- \`winepipewire.so\` present for x86_64-unix and i386-unix"
          } >> "$GITHUB_STEP_SUMMARY"

      # Non-gating by design rather than expected to fail: see the note above.
      # continue-on-error mirrors official _job_test.yml's continue: true.
      - name: umu end to end (best effort)
        continue-on-error: true
        env:
          PROTON_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          # Host prep from the official _job_test.yml "Update host" step.
          # ubuntu-24.04 ships kernel.apparmor_restrict_unprivileged_userns=1,
          # so pressure-vessel's bwrap cannot write a uid map until the
          # bwrap-userns-restrict profile from apparmor-profiles-extra is
          # parsed in. Two deliberate deviations from official: -y, because
          # this step runs under set -euo pipefail and apt-get would otherwise
          # abort on its confirmation prompt, and python3-venv, which official
          # gets from its own venv step.
          sudo apt-get update
          echo "deb http://archive.ubuntu.com/ubuntu/ noble noble-updates noble-backports main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get install -y bubblewrap apparmor apparmor-profiles apparmor-profiles-extra python3-venv
          sudo apparmor_parser /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          # Pinned, never tracked as a branch: official clones -b main, we keep
          # reproducibility. SHA == tag 1.4.4, the newest release (2026-07-25),
          # and it contains fb9912e239fd6c55f3d51b8392077c090807e9f1,
          # "umu_runtime: use cdn-friendly version file url" (1.4.3 carries it
          # too). The previous pin 1.4.2.rc0 predates the fix and 403s against
          # repo.steampowered.com.
          git clone --depth=1 \
            --branch 1.4.4 \
            https://github.com/Open-Wine-Components/umu-launcher.git
          # Expected tip: cf3d1b107147480c447ffbfb3f789dc74335074c
          test "$(git -C umu-launcher rev-parse HEAD)" = "cf3d1b107147480c447ffbfb3f789dc74335074c"
          python3 -m venv umu-launcher/venv
          # shellcheck disable=SC1091
          source umu-launcher/venv/bin/activate
          pip3 install -e umu-launcher
          export WINEPREFIX="${RUNNER_TEMP}/umu-pfx"
          export PROTONPATH="${PROTON_ROOT}"
          umu-run cmd.exe /c echo "pipewire-proton-ok"

  release:
    name: GitHub Release
    needs: [version, build, smoke]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    # Only job that creates tags / uploads release assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.version.outputs.build_name }}.*
          merge-multiple: true

      - name: Ensure tag + prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.release_tag }}
          NAME: ${{ needs.version.outputs.build_name }}
          WINE_SHA: ${{ needs.build.outputs.wine_sha }}
          WINE_SOURCE: ${{ needs.build.outputs.wine_source }}
          PROTON_SHA: ${{ needs.build.outputs.proton_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

          notes_file=$(mktemp)
          {
            echo "Test build with winepipewire.drv (fixed main-loop lineage)."
            echo ""
            echo "Extract under \`~/.steam/root/compatibilitytools.d/\` and restart Steam."
            echo ""
            echo "## Build metadata"
            echo ""
            if [[ -f "${NAME}.build-info.txt" ]]; then
              echo '```'
              cat "${NAME}.build-info.txt"
              echo '```'
            else
              echo "- proton_sha: \`${PROTON_SHA}\`"
              echo "- wine_sha: \`${WINE_SHA}\` (${WINE_SOURCE})"
            fi
          } > "$notes_file"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - refreshing notes"
            gh release edit "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" \
              --prerelease \
              --title "Proton-CachyOS-PipeWire $TAG" \
              --notes-file "$notes_file"
          fi

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.release_tag }}
          NAME: ${{ needs.version.outputs.build_name }}
        run: |
          set -euo pipefail
          assets=("${NAME}.tar.xz" "${NAME}.sha512sum")
          if [[ -f "${NAME}.build-info.txt" ]]; then
            assets+=("${NAME}.build-info.txt")
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
