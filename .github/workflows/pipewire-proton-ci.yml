# Draft workflow for a personal Proton-CachyOS-PipeWire fork.
# Drop into: .github/workflows/pipewire-proton-ci.yml
#
# Based on NelloKudo/proton-cachyos + CachyOS/proton-cachyos
# (_job_build.yml / snapshot.yml / release.yml), slimmed to one x86_64
# redist cell (baseline or x86-64-v3, see the `variant` input) for free
# GitHub-hosted runners.
#
# Purpose: build Proton against a chosen wine-cachyos SHA (driver CI for
# _upstream_pipewire work), not only the submodule pin in the proton tree.
#
# Prerequisites on the fork:
#   - dispatch override SHAs exist in CachyOS/wine-cachyos or
#     M0n7y5/wine-cachyos (the resolver checks both immutable sources)
#   - dispatch override SHAs CONTAIN the tree's wine submodule pin: the proton
#     tree pins ffmpeg/gstreamer/vkd3d in lockstep with wine, and the official
#     pipeline only ever builds that pin (see the gate in "Resolve wine SHA")
#   - Makefile.in already has --with-pipewire + steamrtdeps/build-pipewire.mk
#     (true on CachyOS/Nello proton 11.0 trees - do not re-add blindly)
#   - Remove obsolete patches/wine/*PROTON_PW_RT* if the tree no longer
#     enables PW_STREAM_FLAG_RT_PROCESS by default
#
# [FACT] pattern validated by Nello run 29689279331 and CachyOS proton CI.
# [EST]  single build cell: ~2.5-3.5h cold, ~25-45m warm with ccache.

name: Proton-CachyOS-PipeWire

on:
  workflow_dispatch:
    inputs:
      wine_sha:
        description: >-
          Full 40-char immutable wine-cachyos commit SHA to build.
          Must contain the proton tree's wine submodule pin (rebase your branch
          onto it first) - older/divergent wine breaks against the tree's
          vendored ffmpeg. Empty = use the proton repo's wine submodule pin.
          (Future: repository_dispatch from wine-side CI can supply the same SHA.)
        type: string
        required: false
        default: ''
      wine_ref:
        description: >-
          Wine branch, tag or SHA to pair with the proton tree's wine submodule
          pin. Use this for driver iteration: push the branch, dispatch, install
          the tarball. If the ref already contains the pin it is built verbatim;
          otherwise CI checks out the pin and merges the ref with --no-ff, and
          fails with the conflicting paths if that does not apply cleanly.
          Resolved against the fork first, then the configured submodule URL,
          because a branch name is not unique across the two remotes.
          Mutually exclusive with wine_sha, which stays the immutable arm and is
          the only one that can publish a release.
        type: string
        required: false
        default: ''
      variant:
        description: >-
          Micro-architecture of the single build cell, taken verbatim from the
          official snapshot.yml matrix. x86_64 is the baseline cell
          (-march=nocona); x86_64_v3 is the x86-64-v3 cell. Both official cells
          share the same rustflags and carry no extra configure argument, so
          this only switches CFLAGS and the -<variant> suffix on the build name.
        type: choice
        required: false
        default: x86_64_v3
        options:
          - x86_64
          - x86_64_v3
      publish_release:
        description: 'Create/update a GitHub prerelease and upload the tarball'
        type: boolean
        default: false
      release_tag:
        description: 'Tag name when publish_release=true (e.g. pipewire-11.0-20260720-slr)'
        type: string
        default: ''
      runner:
        description: >-
          Build job runner label. Default: Ubicloud 30 vCPU x64
          (ubicloud-standard-30; premium fleet is account-default since mid-2026).
          ubicloud-standard-16 is mid-tier; ubuntu-24.04 is free GitHub-hosted fallback.
        type: choice
        required: false
        default: ubicloud-standard-30
        options:
          - ubicloud-standard-30
          - ubicloud-standard-16
          - ubuntu-24.04
  # Tag pushes always use the submodule pin (no wine_sha input on push events)
  # and build x86_64_v3: push events carry no inputs at all, so PROTON_VARIANT
  # below falls back to the same value a plain dispatch defaults to. Dispatch
  # variant=x86_64 explicitly when a baseline build is wanted.
  push:
    tags:
      - 'pipewire-*-*-slr'
      - 'pw-cachyos-*-*-slr'
  # Future: wine-side CI can POST repository_dispatch with client_payload.wine_sha.
  # repository_dispatch:
  #   types: [build-proton-with-wine]

concurrency:
  group: pw-proton-${{ github.ref_name }}-${{ inputs.wine_sha || inputs.wine_ref || 'pin' }}-${{ inputs.variant || 'x86_64_v3' }}-${{ inputs.runner || 'default' }}
  cancel-in-progress: true

# Least privilege default: jobs only get a read-capable GITHUB_TOKEN.
# contents: write is granted solely on the release job (tag + gh release).
permissions:
  contents: read
  actions: read

env:
  # Keep build name Steam-friendly (directory under compatibilitytools.d).
  BUILD_PREFIX: Proton-CachyOS-PipeWire
  # Micro-architecture variant of our single build cell, mirroring the official
  # snapshot.yml x86_64 / x86_64_v3 rows. Exported into every step, so the
  # version job and the ccache guard read one value instead of re-deriving it.
  PROTON_VARIANT: ${{ inputs.variant || 'x86_64_v3' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      full_desc: ${{ steps.version.outputs.full_desc }}
      build_name: ${{ steps.version.outputs.build_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      do_release: ${{ steps.version.outputs.do_release }}
      wine_sha_input: ${{ steps.version.outputs.wine_sha_input }}
      wine_ref_input: ${{ steps.version.outputs.wine_ref_input }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: version
        shell: bash
        env:
          WINE_SHA_IN: ${{ inputs.wine_sha || '' }}
          WINE_REF_IN: ${{ inputs.wine_ref || '' }}
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            full_desc=$(git describe --long --tags)
          else
            full_desc="0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "full_desc=$full_desc" >> "$GITHUB_OUTPUT"

          wine_sha_input="${WINE_SHA_IN//[[:space:]]/}"
          if [[ -n "$wine_sha_input" ]]; then
            if [[ ! "$wine_sha_input" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::wine_sha must be a full 40-char hex commit SHA (got: ${wine_sha_input})"
              exit 1
            fi
            wine_sha_input=$(echo "$wine_sha_input" | tr 'A-F' 'a-f')
          fi
          echo "wine_sha_input=$wine_sha_input" >> "$GITHUB_OUTPUT"

          wine_ref_input="${WINE_REF_IN//[[:space:]]/}"
          if [[ -n "$wine_ref_input" ]]; then
            if [[ -n "$wine_sha_input" ]]; then
              echo "::error::wine_sha and wine_ref are mutually exclusive; wine_sha builds one immutable commit, wine_ref pairs a moving branch with the tree's pin"
              exit 1
            fi
            # Releases stay on the immutable arm: a synthesized merge is not a
            # thing anyone can fetch later by SHA.
            if [[ "${{ inputs.publish_release }}" == "true" || "${{ github.ref_type }}" == "tag" ]]; then
              echo "::error::wine_ref cannot publish a release; dispatch the resulting wine_sha through wine_sha instead"
              exit 1
            fi
            if [[ "$wine_ref_input" == -* ]]; then
              echo "::error::wine_ref must be a branch, tag or SHA (got: ${wine_ref_input})"
              exit 1
            fi
          fi
          echo "wine_ref_input=$wine_ref_input" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            build_name="${BUILD_PREFIX}-${tag}-${PROTON_VARIANT}"
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            tag="${{ inputs.release_tag }}"
            if [[ -n "$wine_sha_input" ]]; then
              build_name="${BUILD_PREFIX}-${full_desc}-wine${wine_sha_input:0:8}-${PROTON_VARIANT}"
            elif [[ -n "$wine_ref_input" ]]; then
              # The tip SHA is not known until the build job resolves the ref,
              # so name the build after the ref. Steam reads this as a directory
              # under compatibilitytools.d, so keep it to one path component and
              # to characters a directory name can hold.
              ref_slug="${wine_ref_input##*/}"
              ref_slug="${ref_slug//[^A-Za-z0-9._-]/-}"
              ref_slug="${ref_slug#-}"
              ref_slug="${ref_slug:0:24}"
              build_name="${BUILD_PREFIX}-${full_desc}-wineref-${ref_slug}-${PROTON_VARIANT}"
            else
              build_name="${BUILD_PREFIX}-${full_desc}-${PROTON_VARIANT}"
            fi
            if [[ "${{ inputs.publish_release }}" == "true" && -n "$tag" ]]; then
              echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
              echo "do_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release_tag=" >> "$GITHUB_OUTPUT"
              echo "do_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name"
          echo "wine_sha_input=${wine_sha_input:-<none>}"
          echo "wine_ref_input=${wine_ref_input:-<none>}"
          if [[ -z "$wine_sha_input" && -z "$wine_ref_input" ]]; then
            echo "wine source: submodule pin"
          fi
          echo "variant=${PROTON_VARIANT}"

  build:
    name: Build ${{ inputs.variant || 'x86_64_v3' }}
    needs: version
    # workflow_dispatch supplies inputs.runner; tag-push has no inputs → free GHA.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    outputs:
      wine_sha: ${{ steps.wine-pin.outputs.wine_sha }}
      wine_source: ${{ steps.wine-pin.outputs.wine_source }}
      proton_sha: ${{ steps.wine-pin.outputs.proton_sha }}
      # The audio gate has to enter the same SDK image the driver was compiled
      # in, and that tag only exists after configure. Publish what the ccache
      # identifier already read back out of the generated Makefile so the two
      # jobs cannot drift onto different images.
      steamrt_image: ${{ steps.ccache-id.outputs.image }}
    # Single source of truth for the build identity the ccache key hashes.
    # Mirrors _job_build.yml, where inputs.cflags/inputs.configure feed both the
    # Configure step and the cache checksum, so the two cannot drift apart.
    env:
      PROTON_TARGET_ARCH: x86_64
      # Match the CachyOS/Nello snapshot cell for this variant. Job-level env
      # cannot read the env context, so the fallback is spelled out again here
      # rather than reusing PROTON_VARIANT. Only -march differs between the two
      # official rows: rustflags are byte-identical (upstream keeps
      # -Ctarget-cpu=nocona on the v3 cell too) and neither row adds a
      # configure argument, so PROTON_CONFIGURE stays variant-independent.
      PROTON_CFLAGS: ${{ (inputs.variant || 'x86_64_v3') == 'x86_64_v3' && '-O3 -march=x86-64-v3 -mtune=core-avx2' || '-O3 -march=nocona -mtune=core-avx2' }}
      PROTON_RUSTFLAGS: -Copt-level=3 -Ctarget-cpu=nocona
      PROTON_CONFIGURE: --enable-ccache
    steps:
      - name: Debloat GitHub runner
        # Free GHA ~14GB usable; Ubicloud 300-400GB - skip GitHub-image debloat there.
        if: ${{ !startsWith(inputs.runner || 'ubuntu-24.04', 'ubicloud') }}
        # Third-party: pin full commit SHA (tag v3 → v3.2.2 peel).
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >-
            azure-cli
            google-cloud-cli
            microsoft-edge-stable
            google-chrome-stable
            firefox
            postgresql*
            temurin-*
            *llvm*
            mysql*
            dotnet-sdk-*
          remove_packages_one_command: false
          remove_folders: >-
            /usr/share/swift
            /usr/share/miniconda
            /usr/share/az*
            /usr/local/lib/node_modules
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/local/julia
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /usr/share/gradle
          testing: false

      - name: Prepare host
        run: sudo apt-get update && sudo apt-get install -y ccache fontforge-nox

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      # tree:0 keeps submodule blob download smaller (CachyOS/Nello pattern).
      # Never use `git submodule update --remote` - non-reproducible moving tip.
      - name: Submodules
        run: |
          set -euo pipefail
          git submodule update --init --filter=tree:0 --recursive
          mkdir -p build

      - name: Resolve wine SHA
        id: wine-pin
        env:
          WINE_SHA_INPUT: ${{ needs.version.outputs.wine_sha_input }}
          WINE_REF_INPUT: ${{ needs.version.outputs.wine_ref_input }}
        run: |
          set -euo pipefail
          proton_sha=$(git rev-parse HEAD)
          echo "proton_sha=$proton_sha" >> "$GITHUB_OUTPUT"

          wine_url_configured=$(git config -f .gitmodules --get submodule.wine.url)
          wine_fallback_url=https://github.com/M0n7y5/wine-cachyos.git
          wine_path=$(git config -f .gitmodules --get submodule.wine.path)
          test -n "$wine_url_configured"
          test -n "$wine_path"
          test -d "$wine_path"

          # Two different questions. wine_url_configured is what .gitmodules
          # names; wine_url_effective is where the tree actually came from.
          # They diverge whenever a dispatched ref or SHA lives only on the
          # fork, and build-info records the effective one so the artifact
          # never credits a repository that served nothing.
          wine_url_effective="$wine_url_configured"
          # The immutable-SHA arm below names this in its own messages.
          wine_url="$wine_url_configured"
          ref_sha=""

          pin_sha=$(git -C "$wine_path" rev-parse HEAD)
          echo "submodule_pin_sha=$pin_sha" >> "$GITHUB_OUTPUT"
          echo "wine_url_configured=$wine_url_configured" >> "$GITHUB_OUTPUT"

          override="${WINE_SHA_INPUT//[[:space:]]/}"
          wine_ref="${WINE_REF_INPUT//[[:space:]]/}"
          if [[ -n "$override" ]]; then
            if [[ ! "$override" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::wine_sha must be full 40-char lowercase hex (got: ${override})"
              exit 1
            fi
            # No --depth=1: the lockstep gate below needs a real commit graph,
            # and a shallow graft makes `merge-base --is-ancestor` answer "no".
            # The submodule clone is blobless (--filter=tree:0), so a full-history
            # fetch only adds commit metadata the pin does not already carry.
            echo "Fetching immutable wine ${override} from configured submodule URL: ${wine_url}"
            if git -C "$wine_path" fetch --no-tags "$wine_url" "$override"; then
              fetched_url="$wine_url"
            else
              echo "::warning::SHA not served by configured submodule URL; trying ${wine_fallback_url}"
              if ! git -C "$wine_path" fetch --no-tags "$wine_fallback_url" "$override"; then
                echo "::error::wine ${override} is unavailable from both ${wine_url} and ${wine_fallback_url}"
                exit 1
              fi
              fetched_url="$wine_fallback_url"
            fi
            echo "Fetched wine ${override} from ${fetched_url}"
            got=$(git -C "$wine_path" rev-parse FETCH_HEAD)
            if [[ "$got" != "$override" ]]; then
              echo "::error::fetched wine object ${got} != requested ${override}"
              exit 1
            fi

            # Lockstep gate. The proton tree pins its vendored dependencies
            # (ffmpeg, gstreamer, vkd3d, ...) in step with the wine submodule,
            # and the official pipeline only ever builds that pin - so a wine
            # tree that does not contain the pin is an unsupported pairing.
            # Run 30159382825 dispatched wine 6cab070d (topic branch off the
            # older cachyos_11.0_release line, still carrying mediaconv-era
            # dlls/winedmo/libavcodec/pcm_byte_order_reverse_bsf.c written for
            # the pre-6.x FFmpeg API) against this tree's FFmpeg master pin
            # f46e5144, and died ~21 min into `make redist`. Reject in seconds.
            if ! git -C "$wine_path" merge-base --is-ancestor "$pin_sha" "$override"; then
              echo "::error::wine ${override} does not contain the proton tree's wine submodule pin ${pin_sha}"
              if git -C "$wine_path" merge-base --is-ancestor "$override" "$pin_sha"; then
                echo "::error::the pin already contains ${override} - dispatch with an empty wine_sha to build it"
              else
                echo "::error::rebase the wine branch onto ${pin_sha} before dispatching it"
              fi
              exit 1
            fi
            echo "OK: ${override} contains wine submodule pin ${pin_sha}"
            git -C "$wine_path" checkout --detach --force "$override"
            wine_sha=$(git -C "$wine_path" rev-parse HEAD)
            if [[ "$wine_sha" != "$override" ]]; then
              echo "::error::checkout left wine at ${wine_sha}, expected ${override}"
              exit 1
            fi
            wine_source="dispatch-override"
            wine_url_effective="$fetched_url"
          elif [[ -n "$wine_ref" ]]; then
            # Branch mode, for the iterate-on-the-driver loop: push to the wine
            # branch, dispatch this, install the tarball. Pairing the branch
            # with the tree's pin is CI's job, not a merge to hand-craft before
            # every run. Releases still go through the immutable wine_sha arm.
            # Fork first, which is the opposite of the immutable arm above and
            # deliberate. A SHA is globally unique, so whichever remote serves
            # it hands over the same commit. A branch name is not: CachyOS
            # carries cachyos_11.0_release/_upstream_pipewire too, and theirs is
            # the stale 6cab070d the pin already absorbed. This input exists to
            # build the fork's branch, so ask the fork first and fall back to
            # the configured remote for branches only CachyOS has.
            echo "Fetching wine ref '${wine_ref}' from ${wine_fallback_url}"
            if git -C "$wine_path" fetch --no-tags "$wine_fallback_url" "$wine_ref"; then
              wine_url_effective="$wine_fallback_url"
            else
              echo "::warning::ref '${wine_ref}' not served by ${wine_fallback_url}; trying ${wine_url_configured}"
              if ! git -C "$wine_path" fetch --no-tags "$wine_url_configured" "$wine_ref"; then
                echo "::error::wine ref '${wine_ref}' is unavailable from both ${wine_fallback_url} and ${wine_url_configured}"
                echo "::error::check the spelling and that the branch is pushed; a tag or a full SHA is accepted here too"
                exit 1
              fi
              wine_url_effective="$wine_url_configured"
            fi
            ref_sha=$(git -C "$wine_path" rev-parse FETCH_HEAD)
            echo "Fetched wine ref '${wine_ref}' -> ${ref_sha} from ${wine_url_effective}"

            if git -C "$wine_path" merge-base --is-ancestor "$ref_sha" "$pin_sha"; then
              echo "::error::the pin ${pin_sha} already contains ref '${wine_ref}' (${ref_sha}), served by ${wine_url_effective}"
              echo "::error::nothing to pair. Either the branch has not been pushed and a same-named branch on the other remote answered instead, or the pin has absorbed this work already."
              exit 1
            fi

            if git -C "$wine_path" merge-base --is-ancestor "$pin_sha" "$ref_sha"; then
              # Fast path, same result as the immutable arm: the branch already
              # sits on the pin, so build it verbatim and synthesize nothing.
              git -C "$wine_path" checkout --detach --force "$ref_sha"
              wine_sha="$ref_sha"
              wine_source="ref-contains-pin"
              echo "OK: ref '${wine_ref}' (${ref_sha}) already contains pin ${pin_sha}"
            else
              # Diverged, which is the normal state a month after the branch was
              # cut: CachyOS moved the pin underneath it. Build the pairing a
              # maintainer would otherwise produce by hand, in the runner.
              merge_base=$(git -C "$wine_path" merge-base "$pin_sha" "$ref_sha")
              pin_ahead=$(git -C "$wine_path" rev-list --count "${merge_base}..${pin_sha}")
              ref_ahead=$(git -C "$wine_path" rev-list --count "${merge_base}..${ref_sha}")
              echo "CachyOS has advanced the pin by ${pin_ahead} commits since this branch left the shared base ${merge_base}."
              echo "The branch carries ${ref_ahead} commits of its own. Synthesizing the pairing with a --no-ff merge."
              git -C "$wine_path" checkout --detach --force "$pin_sha"
              if ! git -C "$wine_path" \
                   -c user.name='proton-cachyos CI' \
                   -c user.email='ci@users.noreply.github.com' \
                   -c commit.gpgsign=false \
                   merge --no-ff --no-edit \
                   -m "CI: pair ${wine_ref} (${ref_sha}) with wine pin ${pin_sha}" "$ref_sha"; then
                echo "::error::auto-merge conflict pairing ref '${wine_ref}' (${ref_sha}) with wine pin ${pin_sha}"
                echo "::error::conflicting paths:"
                git -C "$wine_path" diff --name-only --diff-filter=U | while read -r conflicted; do
                  echo "::error::  ${conflicted}"
                done
                echo "::error::CI does not resolve conflicts. Rebase '${wine_ref}' onto ${pin_sha}, push, then dispatch again."
                echo "::error::If the branch is already current, CachyOS edited the same lines and the conflict is real."
                git -C "$wine_path" merge --abort || true
                exit 1
              fi
              wine_sha=$(git -C "$wine_path" rev-parse HEAD)
              wine_source="ref-merged-onto-pin"
              echo "OK: synthesized merge ${wine_sha} = pin ${pin_sha} + ref '${wine_ref}' (${ref_sha})"
              echo "Reproduce it with: git checkout ${pin_sha} && git merge --no-ff ${ref_sha}"
              echo "The merge commit SHA differs per run because it carries a timestamp; its tree does not."
            fi
          else
            wine_sha="$pin_sha"
            wine_source="submodule-pin"
          fi

          {
            echo "wine_sha=$wine_sha"
            echo "wine_source=$wine_source"
            echo "wine_ref_name=$wine_ref"
            echo "wine_ref_sha=$ref_sha"
            echo "wine_url_effective=$wine_url_effective"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Wine pin"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| proton_sha | \`${proton_sha}\` |"
            echo "| wine_url | \`${wine_url_effective}\` |"
            if [[ "$wine_url_effective" != "$wine_url_configured" ]]; then
              echo "| wine_url_configured | \`${wine_url_configured}\` |"
            fi
            echo "| wine_sha | \`${wine_sha}\` |"
            echo "| wine_source | \`${wine_source}\` |"
            echo "| submodule_pin | \`${pin_sha}\` |"
            if [[ -n "$wine_ref" ]]; then
              echo "| wine_ref | \`${wine_ref}\` |"
              echo "| wine_ref_sha | \`${ref_sha}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Effective wine_sha=${wine_sha} (${wine_source})"

      # Fail hard before the multi-hour redist if the product claim cannot hold:
      # umu cmd.exe smoke later will pass even when winepipewire was never built.
      - name: Pre-build assert driver source + configure
        env:
          WINE_SHA: ${{ steps.wine-pin.outputs.wine_sha }}
        run: |
          set -euo pipefail
          wine_path=$(git config -f .gitmodules --get submodule.wine.path)
          test -d "$wine_path"
          wine_sha="${WINE_SHA}"
          test -n "$wine_sha"

          # 1) Effective wine tree must contain winepipewire.drv at this SHA.
          if ! git -C "$wine_path" cat-file -e "${wine_sha}:dlls/winepipewire.drv/pipewire.c"; then
            echo "::error::wine ${wine_sha} has no dlls/winepipewire.drv/pipewire.c - refusing to build a tree without the PipeWire driver source"
            exit 1
          fi
          echo "OK: ${wine_sha}:dlls/winepipewire.drv/pipewire.c present"

          # 2) Proton Makefile must actually pass --with-pipewire (WINE_AUTOCONF_ARGS).
          if [[ ! -f Makefile.in ]]; then
            echo "::error::Makefile.in missing at proton tree root"
            exit 1
          fi
          if ! grep -nE '^WINE_AUTOCONF_ARGS' -A120 Makefile.in | grep -qE -- '--with-pipewire'; then
            echo "::error::Makefile.in WINE_AUTOCONF_ARGS is missing --with-pipewire - config would omit winepipewire.drv"
            grep -nE 'WINE_AUTOCONF|pipewire' Makefile.in || true
            exit 1
          fi
          echo "OK: Makefile.in WINE_AUTOCONF_ARGS includes --with-pipewire"
          {
            echo ""
            echo "### Pre-build driver gates"
            echo "- wine blob: \`${wine_sha}:dlls/winepipewire.drv/pipewire.c\`"
            echo "- Makefile.in: \`--with-pipewire\` in WINE_AUTOCONF_ARGS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure
        working-directory: build
        env:
          CFLAGS: ${{ env.PROTON_CFLAGS }}
          RUSTFLAGS: ${{ env.PROTON_RUSTFLAGS }}
          USE_LTO: 0
        run: |
          set -euo pipefail
          # PROTON_CONFIGURE is a deliberate argument list - leave it unquoted.
          ../configure.sh \
            --build-name=${{ needs.version.outputs.build_name }} \
            --container-engine=docker \
            ${PROTON_CONFIGURE}
          # Official _job_build.yml parity: dump the generated Makefile so the
          # SDK image and vendored-dep (ffmpeg/gstreamer/vkd3d) targets are in
          # the log next to the configure output.
          cat Makefile

      - name: Cache identifier
        working-directory: build
        id: ccache-id
        run: |
          set -euo pipefail
          # _job_build.yml formula: sha1 of the SteamRT SDK image string plus the
          # configure-relevant build identity. The image string only exists after
          # configure, so read it back from the generated Makefile rather than
          # hardcoding a tag. RUSTFLAGS is excluded on purpose: ccache covers the
          # C/C++ objects only, and official hashes cflags + configure likewise.
          # The variant reaches the hash through PROTON_CFLAGS (-march is the
          # only thing the official x86_64 / x86_64_v3 rows disagree on), which
          # is what keeps the two variants on separate cache entries. Assert it,
          # because a variant whose -march never made it into CFLAGS would
          # silently restore and then overwrite the other variant's objects.
          case "$PROTON_VARIANT" in
            x86_64)    want_march=-march=nocona ;;
            x86_64_v3) want_march=-march=x86-64-v3 ;;
            *)
              echo "::error::unknown PROTON_VARIANT '${PROTON_VARIANT}'"
              exit 1
              ;;
          esac
          if [[ "$PROTON_CFLAGS" != *"$want_march"* ]]; then
            echo "::error::variant ${PROTON_VARIANT} expects ${want_march}, but PROTON_CFLAGS is '${PROTON_CFLAGS}' - the ccache key would not separate variants"
            exit 1
          fi
          echo "variant=${PROTON_VARIANT} (${want_march}) cflags='${PROTON_CFLAGS}'"
          image=$(make get-steamrt-image | tail -1)
          test -n "$image"
          base_hash=$(echo "$image $PROTON_TARGET_ARCH $PROTON_CFLAGS $PROTON_CONFIGURE" | sha1sum | cut -d' ' -f1)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "base_hash=$base_hash" >> "$GITHUB_OUTPUT"
          echo "image=$image"
          echo "base_hash=$base_hash"
          # actions/cache saves ~/.ccache, and Makefile.in only falls back to
          # $(HOME)/.ccache when CCACHE_DIR is unset (it also forwards every
          # CCACHE_* host var into the container). If anything in the runner
          # environment moves that path, the container fills a directory the
          # cache step never sees and every run silently starts cold.
          ccache_dir="${CCACHE_DIR:-${HOME}/.ccache}"
          if [[ "$ccache_dir" != "${HOME}/.ccache" ]]; then
            echo "::error::CCACHE_DIR=${ccache_dir} does not match the cached path ${HOME}/.ccache"
            exit 1
          fi
          echo "ccache_dir=${ccache_dir}"

      # Ubicloud runners serve actions/cache through their own transparent cache
      # proxy, so entries never show up in GitHub's /actions/caches API or in the
      # repo cache usage totals. Run 30162478567 saved 568 MB under key
      # ccache-pw-proton-19f5ccea...-1ba4fa16...-30162478567 while that API
      # reported zero entries. Caches are per backend: an ubicloud run and an
      # ubuntu-24.04 run never share one.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache
          key: ccache-pw-proton-${{ steps.ccache-id.outputs.base_hash }}-${{ steps.wine-pin.outputs.wine_sha }}-${{ github.run_id }}
          # Toolchain-scoped only: same wine tree first, then any wine tree built
          # with the same SDK image + arch + cflags/configure. Nothing broader -
          # a universal prefix can restore objects from a different SDK image.
          restore-keys: |
            ccache-pw-proton-${{ steps.ccache-id.outputs.base_hash }}-${{ steps.wine-pin.outputs.wine_sha }}-
            ccache-pw-proton-${{ steps.ccache-id.outputs.base_hash }}-

      - name: Make redist
        working-directory: build
        run: make redist

      - name: Report ccache
        if: always()
        env:
          STEAMRT_IMAGE: ${{ steps.ccache-id.outputs.image }}
        run: |
          set -euo pipefail
          dir="${HOME}/.ccache"
          if [[ ! -d "$dir" ]]; then
            echo "::warning::${dir} does not exist, so the save step has nothing to upload"
            exit 0
          fi
          size=$(du -sh "$dir" | cut -f1)
          files=$(find "$dir" -type f | wc -l)
          echo "ccache dir ${dir}: ${size}, ${files} files"
          if [[ "$files" -eq 0 ]]; then
            echo "::warning::ccache directory is empty; check ENABLE_CCACHE and the container bind mount"
          fi
          # The SDK image ships its own ccache and the host binary may be older,
          # so stats are best effort and never fail the job.
          CCACHE_DIR="$dir" ccache --show-stats 2>&1 | head -30 || true
          {
            echo ""
            echo "### ccache"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| dir | \`${dir}\` |"
            echo "| size | ${size} |"
            echo "| files | ${files} |"
            echo "| sdk image | \`${STEAMRT_IMAGE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert winepipewire.so in redist + write build-info
        id: build-info
        env:
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          WINE_SHA: ${{ steps.wine-pin.outputs.wine_sha }}
          WINE_SOURCE: ${{ steps.wine-pin.outputs.wine_source }}
          PROTON_SHA: ${{ steps.wine-pin.outputs.proton_sha }}
          WINE_REF: ${{ steps.wine-pin.outputs.wine_ref_name }}
          WINE_REF_SHA: ${{ steps.wine-pin.outputs.wine_ref_sha }}
          WINE_PIN: ${{ steps.wine-pin.outputs.submodule_pin_sha }}
          WINE_URL_EFFECTIVE: ${{ steps.wine-pin.outputs.wine_url_effective }}
          WINE_URL_CONFIGURED: ${{ steps.wine-pin.outputs.wine_url_configured }}
          STEAMRT_IMAGE: ${{ steps.ccache-id.outputs.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          info_path="${BUILD_NAME}.build-info.txt"
          tar_path="build/${BUILD_NAME}.tar.xz"
          test -f "$tar_path"

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xJf "$tar_path" -C "$work"
          # tarball root is usually BUILD_NAME/ ; fall back to single top dir.
          if [[ -d "$work/${BUILD_NAME}" ]]; then
            root="$work/${BUILD_NAME}"
          else
            root=$(find "$work" -mindepth 1 -maxdepth 1 -type d | head -1)
          fi
          test -n "$root"

          # --- POST-BUILD: product claim = both unix winepipewire.so shipped ---
          so64="${root}/files/lib/wine/x86_64-unix/winepipewire.so"
          so32="${root}/files/lib/wine/i386-unix/winepipewire.so"
          for so in "$so64" "$so32"; do
            if [[ ! -f "$so" ]]; then
              echo "::error::missing ${so#${root}/} in redist - PipeWire driver was omitted from the build"
              echo "Looking under ${root}/files/lib/wine:"
              find "${root}/files/lib/wine" -iname '*pipewire*' 2>/dev/null || true
              exit 1
            fi
            if [[ ! -s "$so" ]]; then
              echo "::error::${so#${root}/} exists but is empty"
              exit 1
            fi
            ft=$(file -b "$so" || true)
            if [[ "$ft" != *ELF* ]]; then
              echo "::error::${so#${root}/} is not an ELF shared object (file: ${ft})"
              exit 1
            fi
            if command -v readelf >/dev/null 2>&1; then
              if ! readelf -h "$so" >/dev/null; then
                echo "::error::readelf failed on ${so#${root}/}"
                exit 1
              fi
            fi
            echo "OK: ${so#${root}/} ($(wc -c < "$so") bytes, ${ft})"
          done

          # Optional-but-included revision fingerprint (update when driver log strings change).
          # Matches WARN text from core-reconnect invalidate path in pipewire.c
          # ("invalidating %u live stream(s)..."). Bump the pattern when that message is reworded.
          # grep -a on the file, not `strings ... | grep -q`. Under `set -o
          # pipefail` that pipeline is a race: grep -q exits on the first match,
          # strings takes SIGPIPE and returns 141, and the whole pipeline reads
          # as failure exactly when the string IS present.
          if ! grep -qaE 'invalidating .* live stream' "$so64"; then
            echo "::error::x86_64 winepipewire.so lacks expected driver fingerprint string"
            echo "::error::update the fingerprint grep if the driver log message changed deliberately"
            exit 1
          fi
          echo "OK: driver fingerprint 'invalidating .* live stream' present in x86_64 .so"

          # Driver debug info: split out, gate that it decodes, stage it.
          # dist strips lib/ on the way into the redist, so the DWARF survives
          # only in build/dst-wine-*/. Lift it out, re-attach a .gnu_debuglink
          # to the copy testers download, and check gdb still reads the crash
          # breadcrumbs through that link. In the SDK container for gdb and a
          # matching objcopy; the image is already pulled by this point.
          mkdir -p "${PWD}/debug-out"
          cat > "${work}/gate-debug.sh" <<'DBG_GATE'
          #!/bin/bash
          # Runs inside the SDK container.
          #   /redist  extracted redist tree (proton's dist has already stripped it)
          #   /build   proton build tree, where the unstripped driver still lives
          #   /debug   output dir for the split .debug files
          #
          # A .debug_info section existing is not enough: a type lookup has to
          # succeed through the .gnu_debuglink and show cb_mark.
          set -uo pipefail
          REDIST=${REDIST:-/redist}
          BUILD=${BUILD:-/build}
          DEBUG=${DEBUG:-/debug}
          status=0
          fail() { echo "::error::$*"; status=1; }

          for arch in x86_64 i386; do
            echo "::group::${arch} driver debug info"
            shipped="${REDIST}/files/lib/wine/${arch}-unix/winepipewire.so"
            if [ ! -s "$shipped" ]; then
              fail "${arch}: redist has no ${arch}-unix/winepipewire.so"
              echo "::endgroup::"; continue
            fi

            # rules-common.mk's dist step runs objcopy --strip-debug over everything
            # under lib/ on the way into the redist, so the DWARF only survives in the
            # wine install tree that dist copied from.
            unstripped=$(find "$BUILD" -path "*/dst-wine-${arch}/lib/wine/${arch}-unix/winepipewire.so" -print -quit 2>/dev/null)
            if [ -z "$unstripped" ]; then
              fail "${arch}: no pre-dist winepipewire.so under ${BUILD}; cannot lift debug info"
              echo "::endgroup::"; continue
            fi

            if ! readelf -S "$unstripped" | grep -q '\.debug_info'; then
              fail "${arch}: pre-dist winepipewire.so carries no .debug_info, so the PIPEWIRE_CFLAGS -ggdb3 hook did not take effect"
              echo "::endgroup::"; continue
            fi

            # The .debug is worthless if it does not describe the binary we ship.
            id_s=$(readelf -n "$shipped"    | grep -oE 'Build ID: [0-9a-f]+' | head -1)
            id_u=$(readelf -n "$unstripped" | grep -oE 'Build ID: [0-9a-f]+' | head -1)
            if [ -z "$id_s" ] || [ "$id_s" != "$id_u" ]; then
              fail "${arch}: build ID mismatch between shipped (${id_s:-none}) and pre-dist (${id_u:-none}) driver"
              echo "::endgroup::"; continue
            fi
            echo "${arch}: ${id_s}, shipped and pre-dist agree"

            mkdir -p "${DEBUG}/${arch}-unix"
            dbg="${DEBUG}/${arch}-unix/winepipewire.so.debug"
            objcopy --only-keep-debug "$unstripped" "$dbg" || { fail "${arch}: --only-keep-debug failed"; echo "::endgroup::"; continue; }

            # dist installs the driver read only, and --add-gnu-debuglink
            # rewrites it in place. Read the mode back rather than assuming a
            # value, so a later dist change is preserved instead of overwritten.
            mode=$(stat -c%a "$shipped")
            chmod u+w "$shipped" || { fail "${arch}: cannot make the shipped .so writable"; echo "::endgroup::"; continue; }
            # Basename only, which is what gdb looks for next to the .so.
            objcopy --add-gnu-debuglink="$dbg" "$shipped" || { fail "${arch}: --add-gnu-debuglink failed"; chmod "$mode" "$shipped"; echo "::endgroup::"; continue; }
            chmod "$mode" "$shipped"
            now=$(stat -c%a "$shipped")
            if [ "$now" != "$mode" ]; then
              fail "${arch}: shipped .so left as mode ${now}, expected ${mode}; testers must get what dist intended"
            fi

            if readelf -S "$shipped" | grep -qE '\.debug_'; then
              fail "${arch}: shipped .so still carries .debug_* sections; the tarball would balloon"
            fi
            if ! readelf -S "$shipped" | grep -q '\.symtab'; then
              fail "${arch}: shipped .so lost .symtab; function-name backtraces would regress"
            fi
            if ! readelf -S "$shipped" | grep -q '\.gnu_debuglink'; then
              fail "${arch}: shipped .so has no .gnu_debuglink section"
            fi
            echo "${arch}: shipped $(stat -c%s "$shipped") bytes, debug $(stat -c%s "$dbg") bytes"

            # THE gate. An isolated directory holding nothing but the two files, so
            # nothing on the image can satisfy the lookup by accident, and a negative
            # control first so a passing ptype cannot be a false positive.
            iso=$(mktemp -d)
            cp "$shipped" "$iso/winepipewire.so"
            if gdb -batch -ex 'ptype struct pipewire_stream' "$iso/winepipewire.so" 2>&1 | grep -q 'cb_mark'; then
              fail "${arch}: negative control failed, the stripped .so resolved the type on its own"
            fi
            cp "$dbg" "$iso/winepipewire.so.debug"

            out=$(gdb -batch \
              -ex 'ptype struct pipewire_stream' \
              -ex 'print sizeof(struct pipewire_stream)' \
              -ex 'print &((struct pipewire_stream *)0)->cb_mark' \
              -ex 'info variables ^g_streams$' \
              -ex 'info variables ^rt_render$' \
              "$iso/winepipewire.so" 2>&1)
            rm -rf "$iso"

            missing=
            for want in 'cb_mark' 'cb_seq' 'struct list entry'; do
              echo "$out" | grep -q "$want" || missing="${missing} ${want}"
            done
            echo "$out" | grep -qE 'g_streams' || missing="${missing} g_streams"
            echo "$out" | grep -qE 'rt_render' || missing="${missing} rt_render"
            if [ -n "$missing" ]; then
              fail "${arch}: gdb could not decode the crash breadcrumbs, missing:${missing}"
              echo "$out" | head -20
            else
              echo "${arch}: gdb decodes struct pipewire_stream through the debuglink"
              echo "$out" | grep -E 'cb_mark|cb_seq|^\$[0-9]|g_streams|rt_render' | sed 's/^/    /'
            fi
            echo "::endgroup::"
          done

          exit "$status"
          DBG_GATE
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "${root}:/redist" \
            -v "${PWD}/build:/build:ro" \
            -v "${PWD}/debug-out:/debug" \
            -v "${work}:/gate:ro" \
            "$STEAMRT_IMAGE" \
            bash /gate/gate-debug.sh
          dbg64=$(stat -c%s "${PWD}/debug-out/x86_64-unix/winepipewire.so.debug")
          dbg32=$(stat -c%s "${PWD}/debug-out/i386-unix/winepipewire.so.debug")
          echo "debug artifact: x86_64 ${dbg64} bytes, i386 ${dbg32} bytes"

          sha64=$(sha256sum "$so64" | awk '{print $1}')
          sha32=$(sha256sum "$so32" | awk '{print $1}')
          echo "winepipewire_x86_64_sha256=${sha64}"
          echo "winepipewire_i386_sha256=${sha32}"

          {
            echo "build_name=${BUILD_NAME}"
            echo "proton_repo=${{ github.repository }}"
            echo "proton_sha=${PROTON_SHA}"
            echo "proton_ref=${{ github.ref }}"
            echo "wine_sha=${WINE_SHA}"
            echo "wine_source=${WINE_SOURCE}"
            echo "wine_ref=${WINE_REF:-}"
            echo "wine_ref_sha=${WINE_REF_SHA:-}"
            echo "wine_submodule_pin=${WINE_PIN}"
            # The URL the wine tree was actually fetched from. wine_url_configured
            # is what .gitmodules names, which is not the same thing whenever a
            # ref or SHA only the fork serves was dispatched.
            echo "wine_url=${WINE_URL_EFFECTIVE}"
            echo "wine_url_configured=${WINE_URL_CONFIGURED}"
            echo "steamrt_image=${STEAMRT_IMAGE}"
            echo "workflow_run=${RUN_URL}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "winepipewire_x86_64_unix_sha256=${sha64}"
            echo "winepipewire_i386_unix_sha256=${sha32}"
            echo "winepipewire_x86_64_unix_debug_bytes=${dbg64}"
            echo "winepipewire_i386_unix_debug_bytes=${dbg32}"
            echo "debug_artifact=${BUILD_NAME}.driver-debug"
          } | tee "$info_path"

          # Pack metadata into the redist tree and refresh the tarball + checksum
          # so testers get wine_sha even if they only download the .tar.xz.
          cp -f "$info_path" "$root/build-info.txt"
          tar -C "$work" -cJf "$tar_path" "$(basename "$root")"
          (cd build && sha512sum "${BUILD_NAME}.tar.xz" > "${BUILD_NAME}.sha512sum")
          cp -f "$info_path" "build/${BUILD_NAME}.build-info.txt"

          {
            echo ""
            echo "### build-info.txt"
            echo '```'
            cat "$info_path"
            echo '```'
            echo ""
            echo "### Post-build winepipewire.so"
            echo "| Arch | sha256 |"
            echo "|---|---|"
            echo "| x86_64-unix | \`${sha64}\` |"
            echo "| i386-unix | \`${sha32}\` |"
            echo "| x86_64-unix .debug | \`${dbg64}\` bytes |"
            echo "| i386-unix .debug | \`${dbg32}\` bytes |"
            echo ""
            echo "Debug info is split: the tarball ships the driver stripped of"
            echo "\`.debug_*\` with a \`.gnu_debuglink\`, and the matching \`.debug\`"
            echo "files are the \`${BUILD_NAME}.driver-debug\` artifact. CI has already"
            echo "asserted that \`gdb -batch -ex 'ptype struct pipewire_stream'\` resolves"
            echo "\`cb_mark\` through that link on both arches."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.tar.xz
          path: build/${{ needs.version.outputs.build_name }}.tar.xz
          if-no-files-found: error

      - name: Upload artifact checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.sha512sum
          path: build/${{ needs.version.outputs.build_name }}.sha512sum
          if-no-files-found: error

      - name: Upload build-info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.build-info.txt
          path: build/${{ needs.version.outputs.build_name }}.build-info.txt
          if-no-files-found: error

      # Kept out of the tarball on purpose: testers download that, and these
      # are ~1.6 MB per arch against a ~130 KB driver. A developer handed a
      # user's core pulls this artifact, drops the .debug next to the .so from
      # the same run, and gdb resolves it by .gnu_debuglink.
      - name: Upload driver debug info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.driver-debug
          path: debug-out/**/winepipewire.so.debug
          if-no-files-found: error

  # Smoke gate, two layers:
  #
  #   1. Wine smoke (required, dependency-free). Unpacks the redist and drives
  #      files/bin/wine straight from the tree: no Steam runtime, no container,
  #      no network. That keeps driver CI independent of third-party CDNs.
  #
  #   2. umu-launcher end to end (best effort, continue-on-error). umu fetches
  #      the steamrt4 platform from repo.steampowered.com. Run 30162478567
  #      logged "ERROR: repo.steampowered.com returned the status: 403" and
  #      then FileNotFoundError on toolmanifest.vdf. That was not IP filtering:
  #      Valve stopped serving the directory-style version path, and our pinned
  #      umu still asked for it. umu 1.4.2.rc0 requested
  #      /steamrt4/images/latest-public-beta/VERSION.txt, which now answers 403
  #      ("Google-Edge-Cache ... Error: 118") from any client; upstream commit
  #      fb9912e239fd6c55f3d51b8392077c090807e9f1 (2026-07-24) switched to
  #      /steamrt4/images/latest-public-beta.txt, which answers 200. The pin
  #      below now carries that fix, and run 30166266466 got as far as a
  #      downloaded, mtree-verified steamrt4 before dying one step later in
  #      pressure-vessel-wrap: "bwrap: setting up uid map: Permission denied".
  #      ubuntu-24.04 blocks unprivileged user namespaces unless a bwrap
  #      AppArmor profile is loaded, so the step now runs the same host prep
  #      as the official _job_test.yml "Update host" step. With the pin fix
  #      and that profile the step is expected to go green. It stays
  #      non-gating regardless, because it rides on third-party infra
  #      (repo.steampowered.com and the umu repo) that must never decide
  #      whether our driver build is good; official wires its test job with
  #      continue: true for the same reason.
  #
  # Neither layer loads winepipewire.drv against a live daemon: this job runs
  # bare on the runner host, where libpipewire-0.3.so.0 is Ubuntu's 1.0.5 and
  # not the 1.4.2 the driver was built against. Presence is what it gates on.
  # Executing the driver is the separate "Smoke audio" job below, which enters
  # the SDK image so the runtime library matches the deployed one.
  smoke:
    name: Smoke wine
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      WINE_SHA: ${{ needs.build.outputs.wine_sha }}
    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.version.outputs.build_name }}.tar.xz

      - name: Extract redist
        id: extract
        run: |
          set -euo pipefail
          tar -xJf "${BUILD_NAME}.tar.xz"
          # Prefer tree root matching build_name; else first top-level dir.
          if [[ -d "$BUILD_NAME" ]]; then
            root="$BUILD_NAME"
          else
            root=$(find . -mindepth 1 -maxdepth 1 -type d | head -1)
          fi
          test -n "$root"
          # Provenance: the artifact must carry the wine sha the build job resolved.
          test -f "${root}/build-info.txt"
          grep -q "wine_sha=${WINE_SHA}" "${root}/build-info.txt"
          echo "root=${PWD}/${root}" >> "$GITHUB_OUTPUT"
          {
            echo "### build-info.txt (from artifact)"
            echo '```'
            cat "${root}/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wine smoke
        env:
          PROTON_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail

          # End-of-chain driver proof: cheap and redundant with the build job's
          # assert, but it checks the artifact testers actually download.
          for so in x86_64-unix i386-unix; do
            path="${PROTON_ROOT}/files/lib/wine/${so}/winepipewire.so"
            if [[ ! -s "$path" ]]; then
              echo "::error::redist artifact has no ${so}/winepipewire.so"
              find "${PROTON_ROOT}/files/lib/wine" -iname '*pipewire*' || true
              exit 1
            fi
            echo "OK: files/lib/wine/${so}/winepipewire.so ($(wc -c < "$path") bytes)"
          done

          wine="${PROTON_ROOT}/files/bin/wine"
          test -x "$wine"
          missing=$(ldd "$wine" | grep 'not found' || true)
          if [[ -n "$missing" ]]; then
            echo "::error::files/bin/wine has unresolved libraries on a bare runner:"
            echo "$missing"
            exit 1
          fi

          # Bare-metal wine, no pressure-vessel: WINEPREFIX plus dll overrides
          # is all the redist layout needs. mscoree/mshtml are disabled so
          # wineboot never reaches for mono/gecko over the network.
          export WINEPREFIX="${RUNNER_TEMP}/pipewire-smoke-pfx"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEDEBUG=-all
          rm -rf "$WINEPREFIX"

          version=$("$wine" --version)
          echo "wine --version: ${version}"
          test -n "$version"

          timeout 600 "$wine" wineboot -i
          timeout 120 "${PROTON_ROOT}/files/bin/wineserver" -w || true

          for want in system.reg user.reg drive_c/windows/system32; do
            if [[ ! -e "${WINEPREFIX}/${want}" ]]; then
              echo "::error::wineboot -i left no ${want} in the scratch prefix"
              ls -la "$WINEPREFIX" || true
              exit 1
            fi
          done
          echo "OK: scratch prefix booted ($(wc -c < "${WINEPREFIX}/system.reg") byte system.reg)"

          {
            echo ""
            echo "### Wine smoke (dependency-free)"
            echo "- \`files/bin/wine --version\` -> \`${version}\`"
            echo "- \`wineboot -i\` created \`system.reg\`, \`user.reg\`, \`drive_c/windows/system32\`"
            echo "- \`winepipewire.so\` present for x86_64-unix and i386-unix"
          } >> "$GITHUB_STEP_SUMMARY"

      # Non-gating by design rather than expected to fail: see the note above.
      # continue-on-error mirrors official _job_test.yml's continue: true.
      - name: umu end to end (best effort)
        continue-on-error: true
        env:
          PROTON_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          # Host prep from the official _job_test.yml "Update host" step.
          # ubuntu-24.04 ships kernel.apparmor_restrict_unprivileged_userns=1,
          # so pressure-vessel's bwrap cannot write a uid map until the
          # bwrap-userns-restrict profile from apparmor-profiles-extra is
          # parsed in. Two deliberate deviations from official: -y, because
          # this step runs under set -euo pipefail and apt-get would otherwise
          # abort on its confirmation prompt, and python3-venv, which official
          # gets from its own venv step.
          sudo apt-get update
          echo "deb http://archive.ubuntu.com/ubuntu/ noble noble-updates noble-backports main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get install -y bubblewrap apparmor apparmor-profiles apparmor-profiles-extra python3-venv
          sudo apparmor_parser /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          # Pinned, never tracked as a branch: official clones -b main, we keep
          # reproducibility. SHA == tag 1.4.4, the newest release (2026-07-25),
          # and it contains fb9912e239fd6c55f3d51b8392077c090807e9f1,
          # "umu_runtime: use cdn-friendly version file url" (1.4.3 carries it
          # too). The previous pin 1.4.2.rc0 predates the fix and 403s against
          # repo.steampowered.com.
          git clone --depth=1 \
            --branch 1.4.4 \
            https://github.com/Open-Wine-Components/umu-launcher.git
          # Expected tip: cf3d1b107147480c447ffbfb3f789dc74335074c
          test "$(git -C umu-launcher rev-parse HEAD)" = "cf3d1b107147480c447ffbfb3f789dc74335074c"
          python3 -m venv umu-launcher/venv
          # shellcheck disable=SC1091
          source umu-launcher/venv/bin/activate
          pip3 install -e umu-launcher
          export WINEPREFIX="${RUNNER_TEMP}/umu-pfx"
          export PROTONPATH="${PROTON_ROOT}"
          umu-run cmd.exe /c echo "pipewire-proton-ok"

  # Audio gate (required). The build job checks winepipewire.so exists with the
  # right ELF class and a fingerprint string. That cannot catch the failure
  # this job exists for: newer PipeWire entry points are static inline
  # functions dispatching through a SPA interface vtable, so building against
  # 1.4.2 headers and running against an older libpipewire compiles, links,
  # runs and silently returns -ENOTSUP. Only executing the driver against the
  # deployed library sees it.
  #
  # It also A/Bs the RT dispatch flag, on PROPERTIES and not on latency.
  # PipeWire derives effective link async from (out_node.async ||
  # in_node.async) AND both ports carrying PW_IMPL_PORT_FLAG_ASYNC
  # (impl-link.c:1554-1556), and reliable_driver can force synchronous IO at
  # activation (impl-link.c:807-814). node.async and link.async are therefore
  # inputs to the scheduling decision, not the decision. Propagated port
  # latency reads 0.0 in both arms on this null sink, so the job reports what
  # it observed and what it did not.
  #
  # Separate from "Smoke wine" because that job runs bare on the runner, where
  # libpipewire-0.3.so.0 is Ubuntu 24.04's 1.0.5 and not the 1.4.2 the driver
  # was built against, and because the ~9 GB image pull would otherwise sit on
  # its critical path. It gates, unlike the umu step: a silent runtime no-op
  # has to be able to fail the run. No secrets, no audio hardware, no network
  # past the artifact download and the image pull.
  audio:
    name: Smoke audio
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      WINE_SHA: ${{ needs.build.outputs.wine_sha }}
      STEAMRT_IMAGE: ${{ needs.build.outputs.steamrt_image }}
    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.version.outputs.build_name }}.tar.xz

      - name: Extract redist
        id: extract
        run: |
          set -euo pipefail
          tar -xJf "${BUILD_NAME}.tar.xz"
          if [[ -d "$BUILD_NAME" ]]; then
            root="$BUILD_NAME"
          else
            root=$(find . -mindepth 1 -maxdepth 1 -type d | head -1)
          fi
          test -n "$root"
          test -f "${root}/build-info.txt"
          grep -q "wine_sha=${WINE_SHA}" "${root}/build-info.txt"
          echo "root=${PWD}/${root}" >> "$GITHUB_OUTPUT"

      # Written on the host and mounted in, so the container command stays a
      # single script invocation instead of nesting heredocs inside docker run.
      # No de-indent pass: the YAML block scalar already strips this step's
      # common indent, so each body lands with the indentation written here.
      - name: Write gate inputs
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/audio-gate"
          cat > "${RUNNER_TEMP}/audio-gate/wasapi_render_probe.c" <<'PROBE_C'
          /* WASAPI render probe with a hold window so the server graph can be sampled
           * while the stream is live.  argv[1] = milliseconds to hold after Start. */
          #define COBJMACROS
          #include <initguid.h>
          #include <windows.h>
          #include <mmdeviceapi.h>
          #include <audioclient.h>
          #include <stdio.h>
          #include <stdlib.h>

          #define CHECK(hr, what)                                                        \
              do {                                                                       \
                  if (FAILED(hr)) {                                                      \
                      printf("PROBE-FAIL %s hr=0x%08lx\n", (what), (unsigned long)(hr)); \
                      fflush(stdout);                                                    \
                      return 2;                                                          \
                  }                                                                      \
              } while (0)

          int main(int argc, char **argv)
          {
              IMMDeviceEnumerator *devenum = NULL;
              IMMDevice *dev = NULL;
              IAudioClient *client = NULL;
              IAudioRenderClient *render = NULL;
              WAVEFORMATEX *fmt = NULL;
              UINT32 frames = 0, padding = 0, avail, rendered = 0;
              BYTE *buf = NULL;
              HRESULT hr;
              int hold_ms = (argc > 1) ? atoi(argv[1]) : 1000;
              int i, turns = hold_ms / 50;

              printf("PROBE-START %u-bit hold=%dms\n", (unsigned)(sizeof(void *) * 8), hold_ms);
              fflush(stdout);

              hr = CoInitializeEx(NULL, COINIT_MULTITHREADED);
              CHECK(hr, "CoInitializeEx");
              hr = CoCreateInstance(&CLSID_MMDeviceEnumerator, NULL, CLSCTX_INPROC_SERVER,
                                    &IID_IMMDeviceEnumerator, (void **)&devenum);
              CHECK(hr, "CoCreateInstance(MMDeviceEnumerator)");
              hr = IMMDeviceEnumerator_GetDefaultAudioEndpoint(devenum, eRender, eConsole, &dev);
              CHECK(hr, "GetDefaultAudioEndpoint(eRender)");
              hr = IMMDevice_Activate(dev, &IID_IAudioClient, CLSCTX_INPROC_SERVER, NULL, (void **)&client);
              CHECK(hr, "IMMDevice::Activate(IAudioClient)");
              hr = IAudioClient_GetMixFormat(client, &fmt);
              CHECK(hr, "IAudioClient::GetMixFormat");
              printf("PROBE-FORMAT %u ch %lu Hz %u bit\n", fmt->nChannels,
                     (unsigned long)fmt->nSamplesPerSec, fmt->wBitsPerSample);
              hr = IAudioClient_Initialize(client, AUDCLNT_SHAREMODE_SHARED, 0, 2000000, 0, fmt, NULL);
              CHECK(hr, "IAudioClient::Initialize");
              hr = IAudioClient_GetBufferSize(client, &frames);
              CHECK(hr, "IAudioClient::GetBufferSize");
              printf("PROBE-BUFFER %u frames\n", frames);
              hr = IAudioClient_GetService(client, &IID_IAudioRenderClient, (void **)&render);
              CHECK(hr, "IAudioClient::GetService(IAudioRenderClient)");
              hr = IAudioRenderClient_GetBuffer(render, frames, &buf);
              CHECK(hr, "IAudioRenderClient::GetBuffer(prime)");
              hr = IAudioRenderClient_ReleaseBuffer(render, frames, AUDCLNT_BUFFERFLAGS_SILENT);
              CHECK(hr, "IAudioRenderClient::ReleaseBuffer(prime)");
              rendered += frames;
              hr = IAudioClient_Start(client);
              CHECK(hr, "IAudioClient::Start");
              printf("PROBE-RUNNING\n");
              fflush(stdout);

              for (i = 0; i < turns; i++) {
                  Sleep(50);
                  hr = IAudioClient_GetCurrentPadding(client, &padding);
                  CHECK(hr, "IAudioClient::GetCurrentPadding");
                  avail = frames - padding;
                  if (!avail)
                      continue;
                  hr = IAudioRenderClient_GetBuffer(render, avail, &buf);
                  CHECK(hr, "IAudioRenderClient::GetBuffer");
                  hr = IAudioRenderClient_ReleaseBuffer(render, avail, AUDCLNT_BUFFERFLAGS_SILENT);
                  CHECK(hr, "IAudioRenderClient::ReleaseBuffer");
                  rendered += avail;
              }
              hr = IAudioClient_Stop(client);
              CHECK(hr, "IAudioClient::Stop");
              printf("PROBE-OK rendered=%u padding=%u/%u\n", rendered, padding, frames);
              fflush(stdout);
              CoTaskMemFree(fmt);
              IAudioRenderClient_Release(render);
              IAudioClient_Release(client);
              IMMDevice_Release(dev);
              IMMDeviceEnumerator_Release(devenum);
              CoUninitialize();
              return 0;
          }
          PROBE_C
          cat > "${RUNNER_TEMP}/audio-gate/10-ci-null-sink.conf" <<'PW_CONF'
          # Drop-in over the stock steamrt pipewire.conf.
          #
          # The image ships no alsa/udev spa plugin and no session manager, so the
          # stock daemon comes up with only its Dummy/Freewheel drivers and zero audio
          # endpoints. This adds the single software sink the driver renders into, and
          # the "default" metadata object wireplumber would normally publish so
          # winepipewire resolves a default endpoint the same way it does on a desktop.
          context.objects = [
              {   factory = adapter
                  args = {
                      factory.name     = support.null-audio-sink
                      node.name        = "ci-null-sink"
                      node.description = "CI Null Sink"
                      media.class      = "Audio/Sink"
                      object.linger    = true
                      audio.position   = "FL,FR"
                  }
              }
              {   factory = metadata
                  args = { metadata.name = default }
              }
          ]
          PW_CONF
          cat > "${RUNNER_TEMP}/audio-gate/ci_linker.c" <<'LINKER_C'
          /* ci-linker: the smallest session manager that makes this graph testable.
           *
           * The SDK image ships no wireplumber, and PipeWire's core links nothing by
           * itself: node.autoconnect is a request a session manager has to honour.
           * With nobody honouring it, both the sink and the client stream sit in
           * "suspended" with no ports at all, so there is no link, no propagated
           * latency, and nothing to measure.
           *
           * Two steps, in the order wireplumber does them:
           *   1. push a PortConfig(mode=dsp) param onto each adapter node, which is
           *      what actually creates the ports,
           *   2. link the stream's output ports to the sink's input ports, matching on
           *      audio.channel so FL meets FL.
           *
           * argv[1] = sink node.name to link into.
           */
          #include <pipewire/pipewire.h>
          #include <spa/param/audio/format-utils.h>
          #include <spa/param/param.h>
          #include <spa/pod/builder.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>

          #define MAX_NODES 8
          #define MAX_PORTS 64

          struct port {
              uint32_t id;
              uint32_t node_id;
              enum spa_direction direction;
              char channel[16];
              int linked;
          };

          struct node {
              uint32_t id;
              int is_sink;
              int configured;
              struct pw_proxy *proxy;
          };

          struct data {
              struct pw_main_loop *loop;
              struct pw_core *core;
              struct pw_registry *registry;
              struct spa_hook registry_listener;
              struct spa_hook core_listener;
              const char *sink_name;
              uint32_t sink_id;
              struct node nodes[MAX_NODES];
              unsigned n_nodes;
              struct port ports[MAX_PORTS];
              unsigned n_ports;
              unsigned n_links;
          };
          /* PortConfig(mode=dsp) is the param that makes an adapter materialise ports.
           * The format is not optional here: in dsp mode the adapter derives one port
           * per channel from it, so a PortConfig without a format is accepted and then
           * creates nothing, which is exactly what a missing session manager looks
           * like from the outside. */
          static void configure_node(struct data *d, uint32_t id, enum spa_direction dir)
          {
              uint8_t fbuf[1024], pbuf[1024];
              struct spa_pod_builder fb = SPA_POD_BUILDER_INIT(fbuf, sizeof(fbuf));
              struct spa_pod_builder pb = SPA_POD_BUILDER_INIT(pbuf, sizeof(pbuf));
              struct spa_audio_info_raw info;
              struct spa_pod *format, *param;
              struct pw_proxy *proxy;
              struct node *n;

              if (d->n_nodes >= MAX_NODES)
                  return;

              proxy = pw_registry_bind(d->registry, id, PW_TYPE_INTERFACE_Node, PW_VERSION_NODE, 0);
              if (proxy == NULL) {
                  fprintf(stderr, "ci-linker: cannot bind node %u\n", id);
                  return;
              }

              spa_zero(info);
              info.format = SPA_AUDIO_FORMAT_F32P;
              info.rate = 48000;
              info.channels = 2;
              info.position[0] = SPA_AUDIO_CHANNEL_FL;
              info.position[1] = SPA_AUDIO_CHANNEL_FR;
              format = spa_format_audio_raw_build(&fb, SPA_PARAM_Format, &info);

              param = spa_pod_builder_add_object(&pb,
                      SPA_TYPE_OBJECT_ParamPortConfig, SPA_PARAM_PortConfig,
                      SPA_PARAM_PORT_CONFIG_direction, SPA_POD_Id(dir),
                      SPA_PARAM_PORT_CONFIG_mode,      SPA_POD_Id(SPA_PARAM_PORT_CONFIG_MODE_dsp),
                      SPA_PARAM_PORT_CONFIG_monitor,   SPA_POD_Bool(false),
                      SPA_PARAM_PORT_CONFIG_control,   SPA_POD_Bool(false),
                      SPA_PARAM_PORT_CONFIG_format,    SPA_POD_Pod(format));

              pw_node_set_param((struct pw_node *)proxy, SPA_PARAM_PortConfig, 0, param);

              n = &d->nodes[d->n_nodes++];
              n->id = id;
              n->is_sink = (dir == SPA_DIRECTION_INPUT);
              n->configured = 1;
              n->proxy = proxy;

              printf("ci-linker: PortConfig(dsp,%s,2ch F32P 48k) -> node %u\n",
                     dir == SPA_DIRECTION_INPUT ? "in" : "out", id);
              fflush(stdout);
          }

          static void try_links(struct data *d)
          {
              if (d->sink_id == SPA_ID_INVALID)
                  return;

              for (unsigned i = 0; i < d->n_ports; i++) {
                  struct port *op = &d->ports[i];
                  if (op->linked || op->direction != SPA_DIRECTION_OUTPUT || op->node_id == d->sink_id)
                      continue;

                  for (unsigned j = 0; j < d->n_ports; j++) {
                      struct port *ip = &d->ports[j];
                      char out[16], in[16], op_s[16], ip_s[16];
                      struct pw_properties *props;

                      if (ip->direction != SPA_DIRECTION_INPUT || ip->node_id != d->sink_id)
                          continue;
                      /* Match channels so FL meets FL. Ports with no audio.channel
                       * (mono, or a driver that did not label them) pair positionally. */
                      if (op->channel[0] && ip->channel[0] && strcmp(op->channel, ip->channel))
                          continue;

                      snprintf(out, sizeof(out), "%u", op->node_id);
                      snprintf(in, sizeof(in), "%u", ip->node_id);
                      snprintf(op_s, sizeof(op_s), "%u", op->id);
                      snprintf(ip_s, sizeof(ip_s), "%u", ip->id);

                      props = pw_properties_new(PW_KEY_LINK_OUTPUT_NODE, out,
                                                PW_KEY_LINK_OUTPUT_PORT, op_s,
                                                PW_KEY_LINK_INPUT_NODE, in,
                                                PW_KEY_LINK_INPUT_PORT, ip_s,
                                                PW_KEY_OBJECT_LINGER, "true",
                                                NULL);
                      if (!props)
                          return;
                      pw_core_create_object(d->core, "link-factory",
                                            PW_TYPE_INTERFACE_Link, PW_VERSION_LINK,
                                            &props->dict, 0);
                      pw_properties_free(props);
                      op->linked = 1;
                      d->n_links++;
                      printf("ci-linker: link %u:%u (%s) -> %u:%u (%s)\n",
                             op->node_id, op->id, op->channel[0] ? op->channel : "-",
                             ip->node_id, ip->id, ip->channel[0] ? ip->channel : "-");
                      fflush(stdout);
                      break;
                  }
              }
          }

          static void on_global(void *data, uint32_t id, uint32_t permissions,
                                const char *type, uint32_t version, const struct spa_dict *props)
          {
              struct data *d = data;

              if (props == NULL)
                  return;

              if (!strcmp(type, PW_TYPE_INTERFACE_Node)) {
                  const char *cls = spa_dict_lookup(props, PW_KEY_MEDIA_CLASS);
                  const char *name = spa_dict_lookup(props, PW_KEY_NODE_NAME);
                  if (cls == NULL)
                      return;
                  if (!strcmp(cls, "Audio/Sink") && name && !strcmp(name, d->sink_name)) {
                      d->sink_id = id;
                      printf("ci-linker: sink \"%s\" is node %u\n", d->sink_name, id);
                      fflush(stdout);
                      configure_node(d, id, SPA_DIRECTION_INPUT);
                  } else if (!strcmp(cls, "Stream/Output/Audio")) {
                      printf("ci-linker: playback stream node %u (%s)\n", id, name ? name : "?");
                      fflush(stdout);
                      configure_node(d, id, SPA_DIRECTION_OUTPUT);
                  }
                  return;
              }

              if (!strcmp(type, PW_TYPE_INTERFACE_Port)) {
                  const char *dir = spa_dict_lookup(props, PW_KEY_PORT_DIRECTION);
                  const char *nid = spa_dict_lookup(props, PW_KEY_NODE_ID);
                  const char *ch = spa_dict_lookup(props, PW_KEY_AUDIO_CHANNEL);
                  struct port *p;

                  if (dir == NULL || nid == NULL || d->n_ports >= MAX_PORTS)
                      return;
                  p = &d->ports[d->n_ports++];
                  p->id = id;
                  p->node_id = (uint32_t)atoi(nid);
                  p->direction = !strcmp(dir, "in") ? SPA_DIRECTION_INPUT : SPA_DIRECTION_OUTPUT;
                  p->linked = 0;
                  snprintf(p->channel, sizeof(p->channel), "%s", ch ? ch : "");
                  printf("ci-linker: port %u node=%u dir=%s ch=%s\n",
                         id, p->node_id, dir, p->channel[0] ? p->channel : "-");
                  fflush(stdout);
                  try_links(d);
              }
          }

          static const struct pw_registry_events registry_events = {
              PW_VERSION_REGISTRY_EVENTS,
              .global = on_global,
          };

          static void on_core_error(void *data, uint32_t id, int seq, int res, const char *message)
          {
              fprintf(stderr, "ci-linker: core error id=%u seq=%d res=%d: %s\n", id, seq, res, message);
              fflush(stderr);
          }

          static const struct pw_core_events core_events = {
              PW_VERSION_CORE_EVENTS,
              .error = on_core_error,
          };

          int main(int argc, char *argv[])
          {
              struct data d = { 0 };
              struct pw_context *context;

              d.sink_name = (argc > 1) ? argv[1] : "ci-null-sink";
              d.sink_id = SPA_ID_INVALID;

              pw_init(&argc, &argv);

              d.loop = pw_main_loop_new(NULL);
              if (!d.loop)
                  return 1;
              context = pw_context_new(pw_main_loop_get_loop(d.loop), NULL, 0);
              if (!context)
                  return 1;
              d.core = pw_context_connect(context, NULL, 0);
              if (!d.core) {
                  fprintf(stderr, "ci-linker: cannot connect to daemon\n");
                  return 1;
              }
              pw_core_add_listener(d.core, &d.core_listener, &core_events, &d);
              d.registry = pw_core_get_registry(d.core, PW_VERSION_REGISTRY, 0);
              pw_registry_add_listener(d.registry, &d.registry_listener, &registry_events, &d);

              printf("ci-linker: watching for playback streams to link into \"%s\"\n", d.sink_name);
              fflush(stdout);

              pw_main_loop_run(d.loop);

              pw_proxy_destroy((struct pw_proxy *)d.registry);
              pw_core_disconnect(d.core);
              pw_context_destroy(context);
              pw_main_loop_destroy(d.loop);
              pw_deinit();
              return 0;
          }
          LINKER_C
          cat > "${RUNNER_TEMP}/audio-gate/extract.py" <<'EXTRACT_PY'
          #!/usr/bin/env python3
          """Pull server-side scheduling PROPERTIES out of a pw-dump snapshot.

          Everything here is what the SERVER reports, never what the driver claims.
          It is still only properties, not effective scheduling. PipeWire computes
          effective link async as (out_node.async || in_node.async) AND both ports
          carrying PW_IMPL_PORT_FLAG_ASYNC, and reliable_driver can force synchronous
          IO at activation regardless, so node.async and link.async are inputs to that
          decision rather than the decision itself. The propagated Latency param is
          recorded next to them because that is where a real scheduling cost would
          surface, but on the CI null-sink topology it reads 0.0 in every arm, so no
          conclusion about graph cycles can be drawn from these numbers.
          """
          import json
          import sys


          def load(path):
              with open(path) as f:
                  return json.load(f)


          def _t(o):
              return str(o.get("type", ""))


          def evidence(path, driver_row=None):
              objs = load(path)
              stream = None
              for o in objs:
                  # Must be a Node: the app's Client object carries the same
                  # media.class, and picking it up loses every port and link.
                  if not _t(o).endswith("Node"):
                      continue
                  p = ((o.get("info") or {}).get("props") or {})
                  if p.get("media.class") == "Stream/Output/Audio":
                      stream = o
                      break
              if stream is None:
                  return None

              sid = stream["id"]
              sinfo = stream.get("info") or {}
              sprops = sinfo.get("props") or {}
              driver_id = sprops.get("node.driver-id")

              sink_name = None
              for o in objs:
                  p = ((o.get("info") or {}).get("props") or {})
                  if o["id"] == driver_id:
                      sink_name = p.get("node.name")

              links = []
              for o in objs:
                  if not _t(o).endswith("Link"):
                      continue
                  i = o.get("info") or {}
                  p = i.get("props") or {}
                  if i.get("output-node-id") == sid:
                      links.append({
                          "id": o["id"],
                          "to_node": i.get("input-node-id"),
                          "state": i.get("state"),
                          # Creation intent only. Not proof on its own, which is why the
                          # propagated Latency below is what we actually compare.
                          "link.async": p.get("link.async"),
                      })

              lat = []
              for o in objs:
                  if not _t(o).endswith("Port"):
                      continue
                  i = o.get("info") or {}
                  p = i.get("props") or {}
                  if str(p.get("node.id")) != str(sid) or p.get("port.direction") != "out":
                      continue
                  for e in ((i.get("params") or {}).get("Latency") or []):
                      if e.get("direction") != "Input":
                          continue
                      lat.append({
                          "port": o["id"],
                          "channel": p.get("audio.channel"),
                          "minQuantum": e.get("minQuantum"),
                          "maxQuantum": e.get("maxQuantum"),
                          "minRate": e.get("minRate"),
                          "maxRate": e.get("maxRate"),
                          "minNs": e.get("minNs"),
                          "maxNs": e.get("maxNs"),
                      })
              lat.sort(key=lambda x: (x["channel"] or "", x["port"]))

              # Client set: every audio node in the graph. If this moves between arms
              # the two samples are not comparable.
              clients = sorted(
                  (((o.get("info") or {}).get("props") or {}).get("node.name") or "?")
                  for o in objs
                  if _t(o).endswith("Node")
              )

              return {
                  "stream_node": sid,
                  "stream_name": sprops.get("node.name"),
                  "server_node_async": sprops.get("node.async"),
                  "node_loop_class": sprops.get("node.loop.class"),
                  "node_loop_name": sprops.get("node.loop.name"),
                  "node_latency_request": sprops.get("node.latency"),
                  "driver_id": driver_id,
                  "driver_name": sink_name,
                  "stream_is_driver": driver_id == sid,
                  "links": links,
                  "propagated_input_latency": lat,
                  "clients": clients,
                  "driver_row": driver_row,
              }


          def ready(path):
              ev = evidence(path)
              if ev is None:
                  return False
              if not ev["links"]:
                  return False
              if not any(l["state"] == "active" for l in ev["links"]):
                  return False
              return bool(ev["propagated_input_latency"])


          def fmt(ev, label):
              print(f"  [{label}] stream node {ev['stream_node']} ({ev['stream_name']})")
              print(f"  [{label}] server node.async = {ev['server_node_async']!r}   "
                    f"loop.class = {ev['node_loop_class']!r}  loop.name = {ev['node_loop_name']!r}")
              print(f"  [{label}] driver = {ev['driver_name']!r} (id {ev['driver_id']}), "
                    f"our node is the driver: {ev['stream_is_driver']}")
              if ev.get("driver_row"):
                  print(f"  [{label}] driver row: {ev['driver_row']}")
              for l in ev["links"]:
                  print(f"  [{label}] link {l['id']} -> node {l['to_node']} state={l['state']} "
                        f"link.async={l['link.async']!r}")
              for e in ev["propagated_input_latency"]:
                  print(f"  [{label}] port {e['port']} ch={e['channel']} propagated Latency[Input]: "
                        f"minQuantum={e['minQuantum']} maxQuantum={e['maxQuantum']} "
                        f"minRate={e['minRate']} maxRate={e['maxRate']} "
                        f"minNs={e['minNs']} maxNs={e['maxNs']}")


          def _truthy(v):
              return v in (True, "true", "1", 1)


          def compare(a_path, b_path, a_row=None, b_row=None, rt_capable=True):
              a = evidence(a_path, a_row)
              b = evidence(b_path, b_row)
              if a is None or b is None:
                  print("::error::one of the arms produced no render stream")
                  return 1
              fmt(a, "no-RT")
              fmt(b, "RT")

              rc = 0
              # Controls. If the topology moved between arms the comparison is void,
              # so these gate regardless of what the driver supports.
              if a["driver_name"] != b["driver_name"]:
                  print(f"::error::sink moved between arms: {a['driver_name']} vs {b['driver_name']}")
                  rc = 1
              if a["clients"] != b["clients"]:
                  print(f"::error::client set moved between arms: {a['clients']} vs {b['clients']}")
                  rc = 1
              if a["driver_row"] and b["driver_row"] and a["driver_row"] != b["driver_row"]:
                  print(f"::error::negotiated quantum/rate moved between arms: "
                        f"{a['driver_row']} vs {b['driver_row']}")
                  rc = 1
              if a["stream_is_driver"] or b["stream_is_driver"]:
                  print("::error::our stream node became the graph driver, so no extra cycle is "
                        "charged either way and this A/B measures nothing")
                  rc = 1

              a_async = _truthy(a["server_node_async"])
              b_async = _truthy(b["server_node_async"])
              a_links = [_truthy(l["link.async"]) for l in a["links"]]
              b_links = [_truthy(l["link.async"]) for l in b["links"]]

              amin = [e["minQuantum"] for e in a["propagated_input_latency"]]
              bmin = [e["minQuantum"] for e in b["propagated_input_latency"]]

              print()
              print(f"RESULT server node.async     no-RT={a['server_node_async']!r} RT={b['server_node_async']!r}")
              print(f"RESULT link.async            no-RT={[l['link.async'] for l in a['links']]} "
                    f"RT={[l['link.async'] for l in b['links']]}")
              print(f"RESULT driver row (quantum/rate) {a['driver_row']}")
              print(f"RESULT propagated Latency[Input] minQuantum (recorded, not gated)  no-RT={amin} RT={bmin}")
              if amin and bmin and len(set(amin)) == 1 and len(set(bmin)) == 1:
                  print(f"RESULT minQuantum delta (no-RT minus RT) = {amin[0] - bmin[0]}")

              # The latency readout is recorded, never gated. On this topology every
              # Latency entry is identically 0.0 in both arms, so a delta assertion
              # could only ever assert 0.0, which certifies nothing. If the base ever
              # goes non-zero the metric has come alive and this decision is worth
              # revisiting, so say so loudly rather than silently keeping the numbers.
              if any(v not in (0, 0.0, None) for v in amin + bmin):
                  print("::notice::propagated Latency is no longer identically zero on this "
                        "topology; the minQuantum delta has become meaningful and should be "
                        "reconsidered as a gate")

              if not rt_capable:
                  print("::warning::this wine build does not read WINEPIPEWIRE_RT, so both arms "
                        "ran the same code path; the async-mode flip is recorded, not asserted")
                  return rc

              # Gated: the server's own view of the two properties the RT flag drives.
              # This catches a flag that silently fails to take effect. It is not a
              # statement about effective scheduling, which nothing here observes.
              if not a_async:
                  print("::error::no-RT arm: server reports node.async "
                        f"{a['server_node_async']!r}, expected the async main-loop mode")
                  rc = 1
              if b_async:
                  print("::error::RT arm: server still reports node.async "
                        f"{b['server_node_async']!r}, so PW_STREAM_FLAG_RT_PROCESS did not take effect")
                  rc = 1
              if not a_links or not all(a_links):
                  print(f"::error::no-RT arm: expected every link async, got {a_links}")
                  rc = 1
              if not b_links or any(b_links):
                  print(f"::error::RT arm: expected no async link, got {b_links}")
                  rc = 1
              if rc == 0:
                  print("OBSERVED: WINEPIPEWIRE_RT cleared node.async and link.async on this "
                        "topology, so the flag changed the properties it is meant to change.")
                  print("NOT SHOWN: whether a graph cycle was actually removed. link.async "
                        "reflects link creation intent, reliable_driver can force synchronous "
                        "IO at activation regardless, and propagated port latency read 0.0 in "
                        "both arms, so effective scheduling was never observed here.")
                  print("TO CERTIFY A LATENCY CLAIM you would need, on a topology that reports "
                        "it: non-zero propagated port Latency that moves between the arms, plus "
                        "evidence of the driver relationship that makes the extra cycle apply, "
                        "our node a follower of the node driving the graph. A null sink "
                        "provides neither.")
              return rc


          if __name__ == "__main__":
              args = sys.argv[1:]
              if args and args[0] == "--compare":
                  rest = args[1:]
                  cap = True
                  if "--rt-capable" in rest:
                      i = rest.index("--rt-capable")
                      cap = rest[i + 1] == "1"
                      rest = rest[:i] + rest[i + 2:]
                  sys.exit(compare(rest[0], rest[1],
                                   rest[2] if len(rest) > 2 else None,
                                   rest[3] if len(rest) > 3 else None,
                                   cap))
              if len(args) >= 2 and args[1] == "--ready":
                  sys.exit(0 if ready(args[0]) else 1)
              ev = evidence(args[0], args[1] if len(args) > 1 else None)
              if ev is None:
                  print("  no render stream visible")
                  sys.exit(1)
              fmt(ev, "arm")
          EXTRACT_PY
          cat > "${RUNNER_TEMP}/audio-gate/run-gate.sh" <<'GATE_SH'
          # Runs inside the SDK container. /redist is the extracted tree,
          # /gate is this scratch directory.
          set -euo pipefail
          PROTON_ROOT=/redist
          OUT=/gate
          SCRIPTS=/gate
          fail() { echo "::error::$*"; exit 1; }

          export XDG_RUNTIME_DIR=/tmp/pw-ci-run
          export PIPEWIRE_RUNTIME_DIR="$XDG_RUNTIME_DIR"
          export XDG_CONFIG_HOME=/tmp/pw-ci-cfg
          rm -rf "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/pipewire/pipewire.conf.d"
          chmod 700 "$XDG_RUNTIME_DIR"
          cp "$SCRIPTS/10-ci-null-sink.conf" "$XDG_CONFIG_HOME/pipewire/pipewire.conf.d/"

          so64="${PROTON_ROOT}/files/lib/wine/x86_64-unix/winepipewire.so"
          test -s "$so64" || fail "redist has no x86_64-unix/winepipewire.so"
          readelf -d "$so64" | grep -q 'libpipewire-0.3.so.0' \
            || fail "winepipewire.so does not link libpipewire-0.3.so.0"

          # Does this build know about the RT dispatch mode at all? Same self-arming
          # rule the dispatch assertion uses: require the A/B to move only when the
          # shipped .so actually reads WINEPIPEWIRE_RT.

          echo "::group::Private PipeWire daemon + session manager"
          gcc -O1 -o "$OUT/ci-linker" "$SCRIPTS/ci_linker.c" $(pkg-config --cflags --libs libpipewire-0.3) \
            || fail "ci-linker failed to compile"
          # pw-top is not in this image, so the negotiated quantum/rate is read from the
          # server's own graph recalc line. Scope the debug topic so the log stays small.
          PIPEWIRE_DEBUG=pw.context:D,*:W pipewire > "$OUT/pipewire-daemon.log" 2>&1 &
          pw_pid=$!
          linker_pid=
          cleanup() { kill "$linker_pid" 2>/dev/null || true; kill "$pw_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=
          for _ in $(seq 1 60); do
            if timeout 5 pw-dump >/dev/null 2>&1; then ready=1; break; fi
            kill -0 "$pw_pid" 2>/dev/null || { cat "$OUT/pipewire-daemon.log"; fail "daemon exited during startup"; }
            sleep 0.25
          done
          [ -n "$ready" ] || { cat "$OUT/pipewire-daemon.log"; fail "daemon never accepted a client within 15s"; }
          timeout 10 pw-metadata -n default 0 default.audio.sink '{ "name": "ci-null-sink" }' >/dev/null \
            || fail "could not publish default.audio.sink metadata"
          # The manager socket is what a session manager connects to: setting PortConfig
          # on someone else's node needs the permissions the regular socket withholds.
          PIPEWIRE_REMOTE=pipewire-0-manager "$OUT/ci-linker" ci-null-sink > "$OUT/ci-linker.log" 2>&1 &
          linker_pid=$!
          sleep 1
          grep -q 'sink "ci-null-sink" is node' "$OUT/ci-linker.log" \
            || { cat "$OUT/ci-linker.log"; fail "session manager never saw the null sink"; }
          echo "::endgroup::"

          echo "::group::Scratch wine prefix"
          export WINEPREFIX=/tmp/pw-ci-pfx
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEDEBUG=-all
          rm -rf "$WINEPREFIX"
          "${PROTON_ROOT}/files/bin/wine" --version
          timeout 600 "${PROTON_ROOT}/files/bin/wine" wineboot -i
          timeout 120 "${PROTON_ROOT}/files/bin/wineserver" -w || true
          echo "::endgroup::"

          driver_row() {
            grep -oE "driver 0x[0-9a-f]+ running:1 [^']*\([0-9]+/[0-9]+\)'ci-null-sink'" "$OUT/pipewire-daemon.log" \
              | grep -oE "\([0-9]+/[0-9]+\)" | tail -1 | tr -d '()'
          }

          # run_arm <bits> <label> <rt-value-or-empty>
          run_arm() {
            local bits=$1 label=$2 rtval=$3
            local exe="$OUT/wasapi_render_probe${bits}.exe"
            local log="$OUT/audio-probe-${bits}-${label}.log"
            local dump="$OUT/dump-${bits}-${label}.json"
            local job rc=0 i

            if [ -n "$rtval" ]; then
              env WINE_AUDIO_DRIVER=pipewire WINEPIPEWIRE_RT="$rtval" WINEDEBUG=+pipewire \
                timeout 120 "${PROTON_ROOT}/files/bin/wine" "$exe" 7000 > "$log" 2>&1 &
            else
              env WINE_AUDIO_DRIVER=pipewire WINEDEBUG=+pipewire \
                timeout 120 "${PROTON_ROOT}/files/bin/wine" "$exe" 7000 > "$log" 2>&1 &
            fi
            job=$!
            for i in $(seq 1 40); do
              timeout 6 pw-dump > "$dump" 2>/dev/null || true
              if python3 "$SCRIPTS/extract.py" "$dump" --ready >/dev/null 2>&1; then break; fi
              sleep 0.25
            done
            # Let latency propagation settle before taking the sample we keep.
            sleep 2
            timeout 6 pw-dump > "$dump" 2>/dev/null || true
            DRIVER_ROW=$(driver_row)
            wait "$job" || rc=$?
            ARM_RC=$rc
          }

          status=0
          for bits in 64 32; do
            case "$bits" in
              64) cc=x86_64-w64-mingw32-gcc ;;
              32) cc=i686-w64-mingw32-gcc ;;
            esac
            # Probe the .so for THIS arch. Checking the 64 bit driver while testing
            # the 32 bit one gates each arm on the other arm's capabilities.
            case "$bits" in
              64) so_arch="${PROTON_ROOT}/files/lib/wine/x86_64-unix/winepipewire.so" ;;
              32) so_arch="${PROTON_ROOT}/files/lib/wine/i386-unix/winepipewire.so" ;;
            esac
            test -s "$so_arch" || fail "${bits}-bit: no winepipewire.so in the redist"
            if grep -qaF 'WINEPIPEWIRE_RT' "$so_arch"; then RT_CAPABLE=1; else RT_CAPABLE=0; fi
            echo "${bits}-bit: driver reads WINEPIPEWIRE_RT: ${RT_CAPABLE}"
            "$cc" -O1 -o "$OUT/wasapi_render_probe${bits}.exe" "$SCRIPTS/wasapi_render_probe.c" -lole32 -luuid \
              || fail "${bits}-bit probe failed to compile"

            echo "::group::${bits}-bit render probe (no RT)"
            run_arm "$bits" nort ""
            log="$OUT/audio-probe-${bits}-nort.log"
            echo "probe exit: ${ARM_RC}"
            grep -E '^PROBE-|:pipewire:' "$log" || true
            echo "server evidence:"
            python3 "$SCRIPTS/extract.py" "$OUT/dump-${bits}-nort.json" "$DRIVER_ROW" || true
            echo "::endgroup::"

            if [ "$ARM_RC" -ne 0 ]; then
              echo "::error::${bits}-bit WASAPI render probe exited ${ARM_RC}"; status=1; continue
            fi
            grep -q '^PROBE-OK ' "$log" \
              || { echo "::error::${bits}-bit probe never reported PROBE-OK"; status=1; continue; }

            # 1. runtime vs headers, the silent -ENOTSUP tripwire.
            vline=$(grep -oE 'PipeWire [0-9][0-9.]*, header [0-9][0-9.]*' "$log" | head -1 || true)
            if [ -z "$vline" ]; then
              echo "::error::${bits}-bit: driver never logged its PipeWire runtime/header versions"
              status=1; continue
            fi
            rt_ver=${vline#PipeWire }; rt_ver=${rt_ver%%,*}
            hdr_ver=${vline##*header }
            echo "${bits}-bit: runtime libpipewire ${rt_ver}, headers ${hdr_ver}"
            if [ "$(printf '%s\n%s\n' "$hdr_ver" "$rt_ver" | sort -V | head -1)" != "$hdr_ver" ]; then
              echo "::error::${bits}-bit: runtime libpipewire ${rt_ver} is older than the ${hdr_ver} headers; newer inline entry points will silently return -ENOTSUP"
              status=1; continue
            fi

            # 2/3. real graph walk and default endpoint resolution.
            grep -q 'add_device .*(ci-null-sink)' "$log" \
              || { echo "::error::${bits}-bit: driver never enumerated ci-null-sink"; status=1; continue; }
            grep -qE 'probe for .*: [1-9][0-9]* sinks default="ci-null-sink"' "$log" \
              || { echo "::error::${bits}-bit: driver did not resolve ci-null-sink as default"; status=1; continue; }

            # 4. dispatch self-report. Anchored on the documented-stable prefix only:
            #    the field list after it has already been extended once (node.async).
            if grep -qaF 'audio dispatch: ' "$so_arch"; then
              if grep -qE 'audio dispatch: (render|capture) requested ' "$log"; then
                echo "${bits}-bit: $(grep -oE 'audio dispatch: .*' "$log" | head -1)"
              else
                echo "::error::${bits}-bit: driver ships the dispatch self-report but never logged it, so pw_stream_connect was not reached"
                status=1; continue
              fi
            else
              echo "::warning::${bits}-bit: build predates the audio dispatch self-report (wine-cachyos 32257b88b)"
            fi

            # 5. no error-level line and no dispatch mismatch.
            if grep -qE ':err:pipewire:|MISMATCH' "$log"; then
              echo "::error::${bits}-bit: driver logged an error or a dispatch mismatch"
              grep -E ':err:pipewire:|MISMATCH' "$log"
              status=1; continue
            fi

            # 6. NEW: the graph actually consumed the stream. Only meaningful now that a
            #    session manager links it; an unlinked stream never drains a frame.
            rendered=$(grep -oE 'PROBE-OK rendered=[0-9]+' "$log" | grep -oE '[0-9]+' | head -1)
            bufsz=$(grep -oE 'PROBE-BUFFER [0-9]+' "$log" | grep -oE '[0-9]+' | head -1)
            if [ -z "$rendered" ] || [ -z "$bufsz" ] || [ "$rendered" -le "$bufsz" ]; then
              echo "::error::${bits}-bit: render stream never drained past its first buffer (rendered=${rendered:-?} buffer=${bufsz:-?}); the graph is not consuming"
              status=1; continue
            fi
            echo "${bits}-bit: drained ${rendered} frames through a ${bufsz} frame buffer"

            # ---- RT dispatch property A/B ----------------------------------------
            # Checks that WINEPIPEWIRE_RT flips the node/link async PROPERTIES the
            # server reports. Deliberately not a latency measurement: see the
            # NOT SHOWN / TO CERTIFY lines the comparison prints.
            echo "::group::${bits}-bit RT dispatch property A/B (node.async, link.async)"
            run_arm "$bits" rt 1
            rtlog="$OUT/audio-probe-${bits}-rt.log"
            echo "RT arm probe exit: ${ARM_RC}"
            grep -oE 'audio dispatch: .*' "$rtlog" | head -1 || true
            if [ "$ARM_RC" -ne 0 ]; then
              echo "::error::${bits}-bit: RT arm probe exited ${ARM_RC}"; status=1; echo "::endgroup::"; continue
            fi
            set +e
            python3 "$SCRIPTS/extract.py" --compare \
              "$OUT/dump-${bits}-nort.json" "$OUT/dump-${bits}-rt.json" \
              "$DRIVER_ROW" "$DRIVER_ROW" --rt-capable "$RT_CAPABLE"
            cmp_rc=$?
            set -e
            echo "::endgroup::"
            [ "$cmp_rc" -eq 0 ] || status=1
          done

          exit "$status"
          GATE_SH
          chmod +x "${RUNNER_TEMP}/audio-gate/run-gate.sh"
          wc -l "${RUNNER_TEMP}"/audio-gate/*

      - name: Render probe and RT dispatch property A/B against a private PipeWire daemon
        env:
          PROTON_ROOT: ${{ steps.extract.outputs.root }}
        run: |
          set -euo pipefail
          test -n "$STEAMRT_IMAGE"
          echo "SDK image: ${STEAMRT_IMAGE}"
          # --privileged is deliberately not used. The daemon runs unprivileged
          # with no rtkit and no dbus; module-rt logs that it cannot raise
          # priority and the graph still comes up, which is all this asserts.
          docker run --rm \
            -v "${PROTON_ROOT}:/redist:ro" \
            -v "${RUNNER_TEMP}/audio-gate:/gate" \
            -w /gate \
            "$STEAMRT_IMAGE" \
            bash /gate/run-gate.sh

      - name: Upload audio gate logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ needs.version.outputs.build_name }}.audio-gate-logs
          path: |
            ${{ runner.temp }}/audio-gate/*.log
            ${{ runner.temp }}/audio-gate/*.json
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [version, build, smoke, audio]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    # Only job that creates tags / uploads release assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.version.outputs.build_name }}.*
          merge-multiple: true

      - name: Ensure tag + prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.release_tag }}
          NAME: ${{ needs.version.outputs.build_name }}
          WINE_SHA: ${{ needs.build.outputs.wine_sha }}
          WINE_SOURCE: ${{ needs.build.outputs.wine_source }}
          PROTON_SHA: ${{ needs.build.outputs.proton_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

          notes_file=$(mktemp)
          {
            echo "Test build with winepipewire.drv (fixed main-loop lineage)."
            echo ""
            echo "Extract under \`~/.steam/root/compatibilitytools.d/\` and restart Steam."
            echo ""
            echo "## Build metadata"
            echo ""
            if [[ -f "${NAME}.build-info.txt" ]]; then
              echo '```'
              cat "${NAME}.build-info.txt"
              echo '```'
            else
              echo "- proton_sha: \`${PROTON_SHA}\`"
              echo "- wine_sha: \`${WINE_SHA}\` (${WINE_SOURCE})"
            fi
          } > "$notes_file"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - refreshing notes"
            gh release edit "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" \
              --prerelease \
              --title "Proton-CachyOS-PipeWire $TAG" \
              --notes-file "$notes_file"
          fi

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.release_tag }}
          NAME: ${{ needs.version.outputs.build_name }}
        run: |
          set -euo pipefail
          assets=("${NAME}.tar.xz" "${NAME}.sha512sum")
          if [[ -f "${NAME}.build-info.txt" ]]; then
            assets+=("${NAME}.build-info.txt")
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
