name: PipeWire PR build

on:
  workflow_dispatch:
  push:
    branches:
      - 'pipewire-pr-ci'

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-slim
    outputs:
      sha_short: ${{ steps.version.outputs.sha_short }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Version
      id: version
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x86_64_v3
            cflags: -O3 -march=x86-64-v3 -mtune=core-avx2
            rustflags: -Copt-level=3 -Ctarget-cpu=nocona
            configure: ''
          - variant: x86_64-wow64
            cflags: -O3 -march=nocona -mtune=core-avx2
            rustflags: -Copt-level=3 -Ctarget-cpu=nocona
            configure: --enable-wow64
    uses: ./.github/workflows/_job_build.yml
    with:
      name: proton-cachyos-pipewire-pr-${{ needs.version.outputs.sha_short }}-${{ matrix.variant }}
      cflags: ${{ matrix.cflags }}
      rustflags: ${{ matrix.rustflags }}
      configure: --enable-ccache ${{ matrix.configure }}
      runner: ubicloud-standard-30
      continue: false

  test:
    name: Test
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        variant: [x86_64_v3, x86_64-wow64]
    uses: ./.github/workflows/_job_test.yml
    with:
      name: proton-cachyos-pipewire-pr-${{ needs.version.outputs.sha_short }}-${{ matrix.variant }}
      runner: ubicloud-standard-4
      continue: false
